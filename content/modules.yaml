- id: m0
  'no': 0
  title: 开课准备
  hours: 3
  level: 入门
  summary: 先把设备、照片格式和修图流程弄清楚，后面少走弯路。
  note: null
  stage_homework: null
  lessons:
  - id: m0-01
    'no': '0.1'
    title: 设备与软件
    duration: 1 小时
    outline: iPad 和 Apple Pencil 怎么选（压感、屏幕尺寸、内存会影响可用图层数）；Procreate 是一次性买断的应用；搭配使用的免费调色软件（Lightroom 手机版的免费功能、像素蛋糕）；照片怎么在相册、文件 App、iCloud 之间流转。
    pitfall: 不要下载所谓的"破解版"或"免登录版"调色软件，有安全风险；Lightroom 手机版的基础调色功能免费，入门够用。
    find: 不用找图。
    homework: 装好软件，在 Procreate 新建一张 3000×4000 像素的画布，打开「操作」→「画布」→「画布信息」，记下你的设备在这个尺寸下最多能建多少个图层。
    acceptance: 交一张画布信息截图。
  - id: m0-02
    'no': '0.2'
    title: 认识一张数码照片
    duration: 1 小时
    outline: 像素和分辨率；RAW 和 JPG 的区别（RAW 保留的明暗信息多得多，后期空间大）；色彩空间 sRGB 和 Display P3（发到微博、B 站一律导出 sRGB，否则在别人手机上会偏色）；压缩为什么会让图变糊；怎么看直方图。
    pitfall: 用截图代替原图来修，画质先损失一半；反复用 JPG 保存再打开，每存一次就压缩一次。
    find: 从自己相册里找 3 张照片：一张明显过曝、一张明显欠曝、一张曝光正常，题材不限。
    homework: 在 Lightroom 手机版里打开 3 张照片的直方图，判断各自的曝光问题并写出理由；再把其中一张分别用高质量和低质量导出 JPG，放大到 200% 对比。
    acceptance: 3 道判断全对，能指出压缩造成的色块和糊边。
  - id: m0-03
    'no': '0.3'
    title: 后期全流程和协作规范
    duration: 1 小时
    outline: 完整流程是"选片 → 基础调整（LR）→ 精修（Procreate）→ 特效和合成 → 统一调色 → 导出和交付"；修图前要和 coser 确认的事项（角色、喜欢的风格、修图尺度、哪些地方不能改，比如不改脸型）；返图规范（文件命名、尺寸、水印、交付时间）；肖像权和著作权的基本常识（修别人的照片要经过同意，发布时标注摄影、后期和 coser）。
    pitfall: null
    find: 不用找图。
    homework: 课程页里有一份可打印的沟通清单（角色、风格、修图尺度、不能改的地方、尺寸、水印、交付时间）。自己扮演 coser 填一份，再扮演后期，根据它写出修图计划。
    acceptance: 每一栏都填写，修图计划至少 5 条。
- id: m1
  'no': 1
  title: Procreate 基础操作
  hours: 10
  level: 入门
  summary: 熟悉 Procreate 的画布、手势、画笔、图层、蒙版和选区。
  note: null
  stage:
    title: 换衣服颜色、贴海报、规范导出
    task: |
      用一张照片把 M1 的三件事连起来做一遍：

      1. 导入照片，复制原图层，锁定原图（[1.4 课第 2 步](lesson:m1-04#basic)）。
      2. 给衣服换一个颜色。按 [1.5 课「三种方法怎么选」](lesson:m1-05#choose)挑一种方法，换色层用「颜色」模式。
      3. 用「扭曲」把一张海报贴到墙上，插值设「双立体」，再按 [1.6 课案例一](lesson:m1-06#case-poster)压暗远处、让墙面透出来。
      4. 每个图层改好名字，按 [1.1 课案例一](lesson:m1-01#case-delivery)的顺序导出：先存 .procreate 备份，再导出交付用的 JPEG，文件名按 `角色_日期_序号`。
    time: 约 2 小时
    uses: [m1-01, m1-04, m1-05, m1-06]
    find: 一张全身或半身 cos 照：衣服颜色比较单一、中等深浅（纯白、纯黑先别选，原因见 [1.5 课](lesson:m1-05#why-color-mode)），背景里有一面往远处延伸的墙（走廊、建筑侧面）。海报用角色立绘，或者自己画一张。找不到两样都有的照片，就用两张：一张换色，一张贴海报。
    acceptance:
      - 衣服边缘放大到 200%：没有漏掉的原色边，也没有染到皮肤、头发和背景上
      - 换色后衣服的褶皱明暗还在，不是一块平涂的颜色
      - 海报四个角贴在墙面上，上下两条边和墙上的横线朝同一个方向收；放大到 200% 边缘没有锯齿
      - 海报远处比近处暗，和旁边墙面的明暗一致，不像浮在墙前面
      - 原图层还在、已锁定；「文件」App 里同一个名字有 .procreate 和 .jpg 两个文件
    deliverables:
      - 修图前后对比图
      - 图层面板截图（能看到每层的名字和换色层的混合模式）
      - 衣服边缘和海报一角的 200% 截图
      - 「文件」App 的列表截图
  lessons:
  - id: m1-01
    'no': '1.1'
    title: 界面和画布
    duration: 1.5 小时
    outline: 图库页面；新建画布时尺寸和颜色配置怎么选；导入照片的两种方式（「操作」→「添加」→「插入照片」，或在图库里直接导入）；导出格式怎么选（.procreate 保留图层，PNG 无损，JPEG 体积小，PSD 可以给电脑上的 PS 继续修）。
    pitfall: 导出时只存了 JPEG，图层全没了，之后想改就改不了。
    find: 任意一张自己的 cos 返图，JPG 就行。
    homework: 导入照片，分别导出 .procreate、PNG 和 JPEG 三种格式，比较文件大小。
    acceptance: 交三个文件的大小记录，并说出每种格式适合什么时候用。
  - id: m1-02
    'no': '1.2'
    title: 手势和效率
    duration: 1 小时
    outline: 两指点按撤销、三指点按重做；两指捏合缩放和旋转；两指快速捏合让画布适应屏幕；三指下滑打开拷贝粘贴菜单；三指来回擦清除图层；四指点按进入全屏；长按取色；在「操作」→「偏好设置」→「手势控制」里自定义手势。
    pitfall: null
    find: 不用找图，在空白画布上练。
    homework: 照着课程页的手势清单，把 10 个手势各练 5 遍。
    acceptance: 不看提示，1 分钟内完成撤销、重做、缩放适应、拷贝粘贴、清除图层 5 个操作。
  - id: m1-03
    'no': '1.3'
    title: 画笔、涂抹和擦除
    duration: 2 小时
    outline: 修图最常用的几支笔刷（喷枪里的软画笔用于涂色和加深减淡，细笔刷用于画发丝）；尺寸和不透明度滑块；Pencil 压感；在笔刷工作室里调「稳定性」让线条更顺；涂抹工具用来融合过渡。
    pitfall: 用硬边笔刷修皮肤，修完边缘一块一块的。
    find: 不用找图，在空白画布上练。
    homework: 在空白画布上用 Pencil 画 10 条由轻到重的压感线，再描 20 根弯曲的发丝线；用软画笔画 5 个透明度分别为 10%、25%、50%、75%、100% 的色块。
    acceptance: 发丝线没有明显抖动，5 个色块深浅层次清楚。
  - id: m1-04
    'no': '1.4'
    title: 图层和混合模式
    duration: 2 小时
    outline: '图层面板的新建、复制、合并、编组、不透明度和锁定；修图最常用的混合模式：

      - 「正片叠底」：加深、画阴影

      - 「滤色」和「添加」：发光、光效

      - 「覆盖」和「柔光」：加深减淡、光影重塑

      - 「颜色」：换颜色但保留明暗

      - 「明度」：只改明暗'
    pitfall: 照着 PS 教程找「叠加」模式，在 Procreate 里找不到。它就是「覆盖」。
    find: 一张亮部和暗部都很明显的 cos 照片。
    homework: 在照片上面新建一个色块图层，依次切换 8 种混合模式，每种截一张图拼成对照图，写下各自适合的修图用途。
    acceptance: 交 8 宫格对照图和用途笔记。
  - id: m1-05
    'no': '1.5'
    title: 蒙版、剪辑蒙版和阿尔法锁定
    duration: 2 小时
    outline: '三种功能的区别，以及修图里分别什么时候用：

      - **蒙版**：黑色遮住，白色显示，灰色半透明，可以随时改回来

      - **剪辑蒙版**：上面的图层只在下面图层有内容的地方显示

      - **Alpha 锁定**：只能在已有像素上涂，透明的地方涂不上'
    pitfall: 直接用橡皮擦删除背景，之后发现擦多了也恢复不了。改用蒙版就能随时改回来。
    find: 一张衣服颜色单一、轮廓清楚的全身或半身 cos 照。
    homework: 用三种方法分别给衣服换一次颜色，写下各自的优缺点。
    acceptance: 三张换色图边缘都干净，优缺点说得出至少各一条。
  - id: m1-06
    'no': '1.6'
    title: 选区和变换
    duration: 1.5 小时
    outline: 自动、手绘、矩形、椭圆四种选区；羽化和反转；存储并加载选区；变换的四种模式（自由变换、等比、扭曲、弯曲）；插值方式选「双立体」，避免出现锯齿。
    pitfall: null
    find: 一张有墙面透视的照片（走廊、建筑侧面），再随便找或画一张图案当海报。
    homework: 用「扭曲」把海报贴到透视墙面上，边缘对齐墙的透视线。
    acceptance: 海报四角贴合墙面，没有锯齿。
- id: m2
  'no': 2
  title: Procreate 修图工具
  hours: 12
  level: 基础
  summary: 掌握修图要用的调整菜单、克隆、液化、模糊和抠图。
  note: null
  stage:
    title: 一张场照：去瑕疵、轻度液化、背景虚化
    task: |
      在同一张场照上，按 [2.4 课的先后顺序](lesson:m2-04#order)做完：

      1. 复制原图并锁定，按 [2.6 课](lesson:m2-06#why-groups)的结构分组，每做一步新建或复制一层并马上命名。
      2. 用克隆去掉至少 10 处瑕疵：脸上的痘、衣服上的污渍和线头、地上的纸屑都算。
      3. 用液化把手臂或腰线轻微收细，修的时候打开「2D 网格」检查背景直线。
      4. 做背景虚化：越远越糊，人物和脚下的地面保持清楚，最后补颗粒。
      5. 做一层合并副本，只锐化主体，按 2.6 课的规范导出 JPEG。
    time: 约 3 小时
    uses: [m2-02, m2-03, m2-04, m2-06]
    find: 一张户外或场馆里的全身或半身场照，同时满足：人物身上或周围有几处瑕疵（痘、污渍、线头、地上的纸屑）；手臂或腰线有一点显粗；背景里有直线（门框、地砖、栏杆）；人物和背景之间隔着一段距离，不是贴着墙站。
    acceptance:
      - 去瑕疵的地方放大到 100% 看不到补过的圆形痕迹；缩小到手机屏幕大小看，没有一模一样的图案重复出现
      - 打开 2D 网格，背景直线和网格线平行；收细的轮廓是一条顺滑的线，手肘、手腕的转折还在
      - 人物和脚下的地面清楚，往远处慢慢变糊，没有一条明显的分界线；人物边缘没有一圈发虚的光晕
      - 放大到 100% 看，糊掉的背景和清楚的人物颗粒感一致，背景不像塑料
      - 原图在最下面并锁定，每层都有名字；导出的 JPEG 是 sRGB
    deliverables:
      - 修图前后对比图
      - 打开 2D 网格的检查截图
      - 图层面板截图
      - 放大到 100% 的局部截图（去瑕疵、人物边缘各一处）
  lessons:
  - id: m2-01
    'no': '2.1'
    title: 调整菜单总览
    duration: 2 小时
    outline: 色相饱和度亮度、色彩平衡、曲线（整体和红绿蓝分通道）、渐变映射；每个调整都可以选「图层」（作用于整层）或「Pencil」（只作用于涂到的地方）。
    pitfall: Procreate 的调整会直接改像素，不能事后再调回来，所以**每次调整前先复制一层**。
    find: 3 张偏色照片：偏暗、偏黄（室内暖光）、偏青或偏绿（漫展日光灯常见）各一张。
    homework: 用曲线和色彩平衡把三张图修正到正常。
    acceptance: 画面中灰色物体看起来是中性灰，没有偏色。
  - id: m2-02
    'no': '2.2'
    title: 克隆工具
    duration: 2 小时
    outline: 「调整」→「克隆」的完整用法；长按取样圆盘锁定取样点；用软画笔做克隆笔刷；取样点离修补处多远合适；克隆只对当前图层生效。
    pitfall: 取样点离得太近，修完出现重复的纹理；一笔没画完就抬笔，导致纹理对不齐。
    find: 一张近景照片，脸上有痘痘或斑点，或者衣服上有污渍。
    homework: 去掉照片里至少 20 处瑕疵。
    acceptance: 瑕疵全部去掉，缩小看整体没有明显的重复纹理。
  - id: m2-03
    'no': '2.3'
    title: 液化
    duration: 2 小时
    outline: 各个模式（推、转动、捏合、展开、水晶、边缘、重建、调整）；四个参数（尺寸、压力、失真、动力）；液化的三条原则：大笔刷、低压力、少量多次。
    pitfall: 退出液化之后就不能再用「重建」了，所以液化前一定要复制原图层。
    find: 一张半身照，背景里有直线（门框、地砖、栏杆）。
    homework: 把照片里的手臂或腰线轻微收细。修的时候打开「操作」→「画布」→「绘图指引」→「2D 网格」当参照，检查背景直线有没有跟着弯。
    acceptance: 交修图前后对比，背景直线和网格平行，没有弯曲。
  - id: m2-04
    'no': '2.4'
    title: 模糊、锐化和杂色
    duration: 1.5 小时
    outline: 高斯模糊做景深；动态模糊做速度感；透视模糊做光束和冲击感；锐化放在导出前最后一步，只锐化主体；杂色用来统一画面颗粒（合成时特别重要）。
    pitfall: null
    find: 一张前景、人物、背景距离分明的户外照；一张人物在做动作（挥剑、转身）的照片。
    homework: 做一张背景虚化图，再做一张带动态模糊的速度感图。
    acceptance: 前景、主体、背景的清晰度有层次，主体始终最清楚。
  - id: m2-05
    'no': '2.5'
    title: 抠图
    duration: 2.5 小时
    outline: 自动选区和阈值；手绘选区；用蒙版精修边缘；发丝的处理方法（在蒙版上用细笔顺着发丝方向画，保留半透明）；去白边（用 Alpha 锁定给边缘重新上色）。
    pitfall: 抠图边缘一圈白边或黑边，放到新背景上一眼就假。
    find: 一张头发边缘清楚、背景是纯色的照片（入门）；一张背景复杂的照片（进阶）。
    homework: 抠出人物，分别放到纯色背景和渐变背景上检查边缘。
    acceptance: 在深色和浅色背景上都看不到白边或黑边，发丝边缘自然。
  - id: m2-06
    'no': '2.6'
    title: 不破坏原图的工作习惯
    duration: 1.5 小时
    outline: 原图图层锁定；每做一步新建图层并命名；按"基础、精修、特效、调色"分组；用「复制作品」另存版本；图层数快不够时什么时候合并；导出规范（sRGB、长边尺寸、JPEG 质量）。
    pitfall: null
    find: 不用找图，整理之前的作业文件。
    homework: 把之前的作业整理成规范的图层结构。
    acceptance: 交一张图层面板截图，每层都有名字，分组清楚。
- id: m3
  'no': 3
  title: 视觉基础理论
  hours: 20
  level: 基础
  summary: 学光影、色彩、比例、透视和构图，知道"为什么这样修"。
  note: 可以和 M4、M5 同时学
  stage:
    title: 一张照片的诊断报告
    task: |
      选一张 cos 照片，从**光影、色彩、比例、透视、构图**五个方面各写一段诊断。这一次只诊断、不修图。每一项写三件事：

      1. **看到了什么**：在哪里、什么问题。
      2. **为什么**：用对应那节课的原理解释。
      3. **怎么修**：用哪一课的方法。还没学到的课，先写课号，学到了再回来修。

      每一项配一张标注图。没有问题的项也要写："检查过，没有问题，因为……"
    time: 约 2 小时
    uses: [m3-01, m3-02, m3-03, m3-04, m3-05, m3-06, m3-07]
    find: 一张你想修的 cos 全身照，自己的或经过同意的返图。问题多一点更好练，比如俯拍显矮、肤色偏黄、背景里有直线、构图偏。能找到这个角色的设定图更好，色彩一项可以对照着写。
    acceptance:
      - 五项都写了，每一项都有"看到了什么、为什么、怎么修"三部分；"怎么修"写到了具体的课，不只写"调一下颜色"
      - 光影一项标了主光方向和明暗交界线，并判断了硬光还是软光（[3.1 课第 4 步](lesson:m3-01#portrait)）
      - 色彩一项写出了取色的 H、S、B 数值，脸颊肤色和 [3.3 课的参考范围](lesson:m3-03#why-sb)比较过
      - 比例一项画了头长标尺和分界点（[3.4 课](lesson:m3-04#ruler)），写出了原因是拍摄角度、姿势还是假发，并用背景竖线验证；要液化的部位标出了附近的骨点（[3.5 课](lesson:m3-05#nine)）
      - 透视一项描了透视线、找到视平线（[3.6 课](lesson:m3-06#find-vp)），并判断了有没有镜头畸变、透视畸变、广角边缘拉伸，写出了判断依据
      - 构图一项画了三分线，按 [3.7 课第 4 步](lesson:m3-07#check)的清单检查过关节、留白和边缘干扰
    deliverables:
      - 诊断报告（五段）
      - 五张标注图（可以画在同一张照片的不同图层上，分别截图）
  lessons:
  - id: m3-01
    'no': '3.1'
    title: 光影：三大面五大调
    duration: 3 小时
    outline: 三大面是亮面、灰面、暗面；五大调是高光、灰面、明暗交界线、反光、投影；硬光和软光；光源方向怎么判断；人脸上哪里是高光区、哪里是暗区。
    pitfall: 反光画得比亮面还亮，物体就失去了体积感（反光属于暗部，应该比亮部的灰面暗）。
    find: 一张侧光人像（一边脸亮、一边脸暗）；再在台灯下自己拍一张白色鸡蛋或白色的球。
    homework: 在鸡蛋照片上新建一层，标出五大调的位置；再在侧光人像上标出脸部的明暗交界线。
    acceptance: 五个调子位置都标对，人像的明暗交界线沿着颧骨和鼻侧走。
  - id: m3-02
    'no': '3.2'
    title: 色彩基础
    duration: 3 小时
    outline: 色相、饱和度、明度；色相环；互补色（青和红、品红和绿、黄和蓝）；冷暖；配色的几条法则（互补平衡、面积大小、冷暖平衡）。
    pitfall: null
    find: 3 个角色的官方设定图，只用来取色，不发布。
    homework: 选 3 个角色，每个提取 3～5 个代表色，写出配色关系。
    acceptance: 每组色卡都标出色值，能说清楚是哪种配色关系。
  - id: m3-03
    'no': '3.3'
    title: 人像肤色
    duration: 2 小时
    outline: 肤色主要由橙色和黄色决定；往肤色里加入它的互补色（比如紫、蓝）会让皮肤变脏；肤色要做到色相、饱和度、明度三者统一；不同肤色的参考范围。
    pitfall: null
    find: 一张肤色偏黄或发灰的人像。
    homework: 用取色器记下脸颊的 HSB 数值，修正肤色后再记一次，写出你调了什么、数值怎么变的。
    acceptance: 修正后的肤色落在课程给出的肤色参考范围内，并且看起来干净、不发灰。
  - id: m3-04
    'no': '3.4'
    title: 人体比例和头身比
    duration: 3 小时
    outline: 成人 7～8 头身；身体的关键分界点（下巴、胸线、肚脐、腿根、膝盖）；男女比例的差别；二次元角色比例和真人比例的差距，cos 后期最多能往角色方向靠多少；怎么在照片上新建一层，用头长画出头身比标尺。
    pitfall: null
    find: 3 张全身照：俯拍、平拍、仰拍各一张。
    homework: 在每张照片上新建一层，以头的长度为单位画横线，数出头身比，标出比例问题。
    acceptance: 每张至少指出 2 个比例问题，并写出原因（拍摄角度、姿势还是假发）。
  - id: m3-05
    'no': '3.5'
    title: 骨点和解剖
    duration: 3 小时
    outline: 液化时不能推平的骨点（颧骨、下颌角、锁骨、肩峰、手肘、手腕、髋骨、膝盖、脚踝）；体块的概念；为什么"局部结构都对，整体看着却丑"。
    pitfall: null
    find: 一张动作明显的全身照（叉腰、弯腰、抬腿之类）。
    homework: 在一张照片上标出 9 个骨点。
    acceptance: 9 个骨点位置都正确。
  - id: m3-06
    'no': '3.6'
    title: 透视和镜头畸变
    duration: 3 小时
    outline: '一点、两点、三点透视；视平线；近大远小；焦段和拍摄距离的关系。分清三种"变形"：

      - **镜头畸变**：镜头光学缺陷，直线变弯

      - **透视畸变**：离镜头近的部位被放大，脸变形主要是这个原因

      - **广角边缘拉伸**：广角镜头画面边缘的物体被拉宽'
    pitfall: null
    find: 一张建筑或走廊照片；再找 3 张有问题的：广角近拍的脸、合影边缘被拉宽的人、直线变弯的照片。
    homework: 打开「绘图指引」→「透视」，对着建筑照片放好消失点，确认视平线位置；再判断 3 张问题照片分别是哪种畸变。
    acceptance: 指引线和照片里的透视线基本重合，3 道判断全对。
  - id: m3-07
    'no': '3.7'
    title: 构图
    duration: 3 小时
    outline: 三分法、引导线、留白；裁切时不要切在关节处（手腕、膝盖、脚踝）；横构图和竖构图；二次构图。
    pitfall: null
    find: 一张画面元素比较多的横幅全身照。
    homework: 打开「绘图指引」→「2D 网格」，把格子调成三等分当三分线参考，同一张照片裁出 3 种构图，写出每种的意图。
    acceptance: 3 种裁切都没有切在关节上，意图说得清楚。
- id: m4
  'no': 4
  title: 人像基础修图
  hours: 15
  level: 基础
  summary: 一张人像从诊断、调色到皮肤、光影、妆面的基础精修。
  note: null
  stage:
    title: 一张半身照的基础精修全流程
    task: |
      按 [4.1 课修图清单的顺序](lesson:m4-01#list)修完一张半身 cos 照：

      1. **诊断**：按 4.1 课的四步诊断，写出修图清单。
      2. **曝光和白平衡**：在 Lightroom 手机版里调好，导出后导入 Procreate。
      3. **皮肤**：克隆去瑕疵，低透明度喷枪补肤色，保留质感。
      4. **光影**：在中性灰的「柔光」图层上，按主光方向加深减淡。
      5. **五官和妆面**：需要的话轻度校正五官，再补眼线、唇色、修容、腮红。

      每修完一条，在清单上划掉一条。
    time: 约 4 小时
    uses: [m4-01, m4-02, m4-03, m4-04, m4-05]
    find: 一张半身 cos 照，原图长边 3000 像素以上，脸在画面里不要太小。最好同时有几种问题：偏色或偏暗、脸上有痘或泛红、光线平、妆面不完整。能找到角色设定图的话，唇色、腮红对照着选。
    acceptance:
      - 修图清单至少 5 条，按 4.1 课第 5 步的顺序排，每条写了"在哪里、什么问题、用哪课的方法"
      - 直方图两端没有大面积贴墙；照片里本来是白色或灰色的东西看起来是中性的，肤色自然
      - 放大到能看清毛孔，修过的皮肤和没修的一样有纹理，没有一块块光滑的补丁；缩小到手机大小，整张脸干净、肤色均匀
      - 灰度对比里，额头、鼻梁、颧骨上方、下巴比周围亮，太阳穴、颧骨下方、鼻侧、下颌下方比周围暗；过渡是渐变的，没有脏斑
      - 两边眼线、腮红、眉毛对称，妆面边缘是渐变的；和原图来回对比，仍然认得出是本人
    deliverables:
      - 修图清单
      - 彩色修图前后对比
      - 灰度修图前后对比（打开灰度观察层截图）
      - 图层面板截图
  lessons:
  - id: m4-01
    'no': '4.1'
    title: 修图前的四步诊断
    duration: 2 小时
    outline: '诊断完写出修图清单；修图时打开「参考」窗口，放大修局部时也能看到全图。四步是：

      1. 缩小看全图

      2. 水平翻转画布（「操作」→「画布」→「水平翻转画布」）

      3. 切到灰度看明暗（在最上面加一层填充黑色、混合模式设为「颜色」）

      4. 对照角色设定图'
    pitfall: null
    find: 3 张你想修的 cos 照片。
    homework: 给 3 张照片做诊断，写出修图清单。
    acceptance: 每张清单至少 5 条，按先后顺序排列。
  - id: m4-02
    'no': '4.2'
    title: 曝光和白平衡
    duration: 3 小时
    outline: 曝光、对比度、高光、阴影、白色色阶、黑色色阶；色温和色调；颜色混合（HSL）；曲线；局部蒙版；调好后导出到 Procreate 继续精修。
    pitfall: null
    find: 3 张问题照片：过曝、欠曝、偏色各一张。有 RAW 文件最好。
    homework: 完成 3 张照片的基础调整。
    acceptance: 直方图两端没有大面积溢出，肤色正常。
  - id: m4-03
    'no': '4.3'
    title: 皮肤处理
    duration: 3 小时
    outline: '为什么会修出塑料脸；Procreate 做不了 PS 的高低频磨皮，这一课讲替代做法。三步流程：

      1. 用克隆去瑕疵

      2. 新建图层，用低透明度喷枪补肤色

      3. 保留皮肤质感'
    pitfall: 放到很大去磨皮，修完整张脸没有质感。
    find: 一张能看清皮肤的面部特写。
    homework: 完成一张面部特写的皮肤处理。
    acceptance: 放大到 100% 还能看到毛孔质感，缩小看整体干净。
  - id: m4-04
    'no': '4.4'
    title: 光影重塑（加深减淡）
    duration: 4 小时
    outline: '新建图层设为「柔光」或「覆盖」，用 5%～10% 透明度的白色和黑色喷枪涂；先开灰度观察层；按主光方向涂。面部光影地图：

      - 高光区：额头中间、鼻梁、颧骨上方、下巴

      - 暗区：太阳穴、颧骨下方、下颌下方、鼻侧'
    pitfall: null
    find: 一张光线很平、脸看起来扁的人像。阴天拍的或正面闪光灯拍的最典型。
    homework: 给一张平光人像做光影重塑。
    acceptance: 交修图前后对比和灰度图，灰度图里五官立体感明显增强，没有脏斑。
  - id: m4-05
    'no': '4.5'
    title: 五官和妆面
    duration: 3 小时
    outline: 按三庭五眼轻度液化校正五官；补眼线（细笔刷，正片叠底）；唇色；修容和腮红（新建图层，正片叠底或颜色模式）；补画眉毛。
    pitfall: null
    find: 一张妆面不完整或左右不对称的半身照。
    homework: 给一张照片补一次完整妆面（眼线、唇色、修容、腮红）。
    acceptance: 左右对称，妆面边缘没有生硬的色块。
- id: m5
  'no': 5
  title: cos 专项
  hours: 18
  level: 进阶
  summary: 解决 cos 照片特有的问题：假发、美瞳、服装、比例、穿帮和角色色。
  note: null
  stage:
    title: 一张 cos 照的完整精修
    task: |
      在一张 cos 照上完成假发、眼睛、服装、比例、调色五项。先按 [4.1 课](lesson:m4-01)诊断、写清单，再按清单的顺序修（形在前，角色色在最后）：

      1. **比例**：量出头身比，判断显矮的原因，按 5.4 课修。
      2. **穿帮、皮肤、光影**：有路人、灯架就按 5.5 课去掉；皮肤和光影按 M4 的方法做基础处理。
      3. **假发**：去杂毛，盖住露出的真发或贴片边，需要的话补美人尖。
      4. **眼睛**：去掉美瞳反光，保留或补上主眼神光；瞳色和设定不一样就换。
      5. **服装**：去乱褶、保留结构褶，修好一处道具接缝或胶痕。
      6. **调色**：做设定色卡，校正假发和衣服，再按角色气质加一层渐变映射。
    time: 约 5 小时
    uses: [m5-01, m5-02, m5-03, m5-04, m5-05, m5-06]
    find: 一张全身或大半身的 cos 照，加上这个角色的官方设定图。照片里假发、眼睛、衣服都看得清，五项里至少三项有明显问题（比如假发有杂毛、美瞳反光、衣服有乱褶、俯拍显矮、假发颜色和设定不一样）。全身照里眼睛太小、看不清纹理的，眼睛一项只检查眼神光在不在、两眼是否一致。
    acceptance:
      - 修图前后两张图都画着头身比标尺；腿部拉长不超过原腿长的 15%，背景直线没有弯，膝盖、脚踝、肩的骨点形状还在
      - 缩小到手机屏幕大小，新补的发丝和原来的发型连在一起；发际线从里到外逐渐变稀，没有硬边
      - 两只眼睛的眼神光在同一个方位，和脸上的光一致；虹膜有纹理，瞳孔是黑的
      - 去掉乱褶的地方布料纹理连续，手肘、腋下的结构褶还在；道具接缝放大到 100% 看不出来
      - 吸假发和衣服的灰面，和设定色卡比，色相差在 10 以内，饱和度、亮度差在 10% 以内（[5.6 课的标准](lesson:m5-06#why-tolerance)）；皮肤没有被染成假发或氛围的颜色
    deliverables:
      - 修图清单
      - 修图前后对比（都带头身比标尺）
      - 假发、眼睛、道具接缝三处局部放大截图
      - 设定色卡和校色前后对比
      - 图层面板截图（按原图、基础、精修、特效、调色分组）
  lessons:
  - id: m5-01
    'no': '5.1'
    title: 假发和发际线
    duration: 3 小时
    outline: 用克隆和涂抹去碎发和杂毛；补画发丝（吸取假发颜色，用细笔沿发丝生长方向画，再加一层「添加」模式画高光）；补美人尖和鬓角；遮住露出的真发；修发际线贴片的边缘；改发型轮廓。
    pitfall: 补的发丝方向和周围不一致，或者粗细一样，看起来像贴纸。
    find: 一张假发有杂毛、露出真发或发际线不贴的照片。
    homework: 修干净一张假发有问题的照片，补画美人尖。
    acceptance: 缩小看时新补的发丝和原发型融为一体，看不出补过。
  - id: m5-02
    'no': '5.2'
    title: 美瞳和眼神光
    duration: 3 小时
    outline: 处理美瞳反光，但**一定要保留主眼神光**；换瞳色（新建图层剪辑到眼睛，用「颜色」或「覆盖」模式，再画虹膜纹理）；竖瞳等特殊瞳孔；清理眼白。
    pitfall: 反光全部去掉，眼睛像两个黑洞。
    find: 一张眼睛占画面比较大的近景照，能看清美瞳或瞳孔。
    homework: 给同一双眼睛画 3 种不同角色的瞳孔。
    acceptance: 3 种都有眼神光，虹膜有纹理，不是平涂一块颜色。
  - id: m5-03
    'no': '5.3'
    title: 衣服褶皱和道具接缝
    duration: 3 小时
    outline: 先分清哪些褶皱该留（结构褶，比如手肘弯曲处）、哪些该去（乱褶、死褶）；用「柔光」图层把褶皱的明暗拉平；用克隆补布料纹理；去线头、胶痕、拉链；改善道具质感（比如让塑料看起来像金属）。
    pitfall: null
    find: 一张衣服有乱褶的照片；一张带道具（武器、盔甲）的照片。
    homework: 去掉衣服上的乱褶、保留结构褶，再修好道具上的一处接缝或胶痕。
    acceptance: 乱褶去掉后布料纹理连续，结构褶完整保留，道具接缝看不出来。
  - id: m5-04
    'no': '5.4'
    title: 形体比例修正
    duration: 3 小时
    outline: '- **头身比和腿长**：用选区框住腰部以下，用变换拉长，一般不超过 10%～15%，拉完修复背景里的直线

      - **广角和透视**：先在 Lightroom 里做镜头校正，再用变换的「扭曲」「弯曲」做局部修正

      - **液化崩了怎么救**：先把人物抠到单独一层再液化；人物缩小后露出的空隙在背景层上用克隆补；骨点不要推平

      - **二次元比例的尺度**：可以往角色方向靠，但推过头会进入恐怖谷'
    pitfall: null
    find: 一张俯拍或用广角拍的全身照，背景里最好有直线（地砖、门框）。
    homework: 修正一张全身照的比例。
    acceptance: 交修图前后对比，两张都画上头身比标尺（3.4 学的画法）；背景里的直线（地砖、门框）没有弯。
  - id: m5-05
    'no': '5.5'
    title: 去路人、去灯架、改构图
    duration: 3 小时
    outline: 大面积克隆；复制相似区域，用蒙版拼接；扩展画布（「操作」→「画布」→「裁剪并调整大小」）后再补齐；补出来的内容透视要和原图一致。
    pitfall: null
    find: 一张背景里有路人或灯架的漫展场照。
    homework: 去掉 3 个干扰物，再扩展画布做二次构图。
    acceptance: 去掉的地方没有涂抹痕迹，补出来的部分透视正确。
  - id: m5-06
    'no': '5.6'
    title: 按角色设定还原颜色
    duration: 3 小时
    outline: 用 Procreate 取色器和「从照片创建调色板」功能从设定图取色；假发和衣服校色（剪辑图层，「颜色」模式）；整体色调贴合角色气质（冷、暖、梦幻等）；用渐变映射统一氛围。
    pitfall: null
    find: 一张 cos 照片，加上这个角色的官方设定图。
    homework: 选一个角色，做出设定色卡，并给照片校色。
    acceptance: 校色后的假发和衣服颜色与设定色卡并排对比时差别很小。
- id: m6
  'no': 6
  title: 特效和氛围
  hours: 15
  level: 进阶
  summary: 光效、粒子和氛围，让特效真正"照"到人物身上。
  note: null
  stage:
    title: 一张"释放技能"的特效图
    task: |
      做一张角色正在释放技能的图，把 M6 的方法串起来。动手前先写一句：特效（也就是光源）在哪里、什么颜色。

      1. 按角色的技能设定决定特效的样子和颜色，至少手绘一种发光特效：光剑、魔法阵、火焰或丁达尔光（[6.3 课](lesson:m6-03)）。
      2. 再加一种氛围：在黑色画布上画的光效素材（[6.2 课](lesson:m6-02)），或者三层景深的粒子（[6.4 课](lesson:m6-04)），也可以都做。
      3. 给人物加环境光：边缘光、环境色、接触光，按场景判断要不要投影（[6.5 课](lesson:m6-05)）。
      4. 最后用渐变映射或泛光统一氛围（[6.1 课](lesson:m6-01)），用蒙版保护脸。
    time: 约 4 小时
    uses: [m6-01, m6-02, m6-03, m6-04, m6-05]
    find: 一张适合"放技能"的 cos 照：手持武器、举手施法、张开手掌、出拳这类有动作的姿势，背景偏暗或夜景更容易出效果。再找这个角色技能的官方立绘或游戏画面，只用来参考颜色和形状，不发布。先按 M4 做好基础修图。
    acceptance:
      - 发光有核心、内晕、外晕三层：中心发白，往外是饱和的颜色，再往外慢慢淡出；放大到 100% 光效边缘没有黑框、灰框
      - 挡在光前面的东西把光挡住了：握剑的手指在光的前面，魔法阵被脚挡住的地方擦掉了
      - 人物朝向特效的一侧有特效的颜色，背对的一侧没有；离特效越近越亮，接触的地方最亮；环境光没有画到背景上
      - 缩小到手机屏幕大小，第一眼看到的是人，然后才是特效；放大到 100% 看脸，没有泛光雾、色边和错位
      - 特效的颜色和角色技能设定一致；皮肤没有被氛围染成青、紫或灰
    deliverables:
      - 修图前后对比
      - 加环境光前后对比
      - 图层面板截图（特效、环境光分别成组）
      - 光源位置和颜色的说明
  lessons:
  - id: m6-01
    'no': '6.1'
    title: 泛光、色像差、渐变映射和故障艺术
    duration: 2 小时
    outline: 泛光的三个参数（过渡、大小、燃烧）；色像差做出镜头感；渐变映射统一氛围；故障艺术做赛博风。
    pitfall: null
    find: 一张氛围平淡、想加强气氛的照片。
    homework: 同一张图做 3 种不同氛围。
    acceptance: 3 张的风格区别明显，主体没有被特效盖掉。
  - id: m6-02
    'no': '6.2'
    title: 叠加光效素材
    duration: 3 小时
    outline: 先在黑色画布上用「亮度」笔刷组画出光斑、光束这类素材；再用「滤色」或「添加」模式叠到照片上；用蒙版擦掉多余部分；用变换让光效贴合透视。
    pitfall: null
    find: 一张想加光效的照片。光效素材不用找：这节课先教你在黑色画布上用「亮度」笔刷组自己画光斑和光束。
    homework: 在黑色画布上画 2 种光效（比如光斑和光束），叠到照片上并融合到画面里。
    acceptance: 光效边缘没有黑框，方向和画面光源一致。
  - id: m6-03
    'no': '6.3'
    title: 手绘光效
    duration: 4 小时
    outline: '- **光剑**：白色核心一层，外发光颜色一层，「添加」模式加高斯模糊

      - **魔法阵**：用速创形状和绘图指引的对称功能画

      - **火焰**：顺着火焰流向画，配合「亮度」笔刷组里的浅色画笔

      - **丁达尔光**：复制图层 → 降饱和 → 曲线提亮 → 「添加」模式 → 透视模糊'
    pitfall: null
    find: 一张手持武器（剑、棍、法杖）的照片；一张适合加魔法阵的照片（举手、施法的姿势）。
    homework: 做一张光剑图和一张魔法阵图。
    acceptance: 发光有核心和外晕两层，不是一根平涂的线。
  - id: m6-04
    'no': '6.4'
    title: 粒子和飘落
    duration: 3 小时
    outline: 自带的「亮度」→「闪光」笔刷；在笔刷工作室里调散布和颗粒，导入形状来源，做樱花、雪花等自定义笔刷；按景深分层（前景粒子大而虚，背景粒子小而清楚）。
    pitfall: null
    find: 一张有前后景深的户外照片。笔刷形状不用找：在空白画布上自己画一朵樱花或一片雪花当形状来源。
    homework: 用自己画的形状做一支飘落笔刷，画出三层景深的飘落效果。
    acceptance: 三层的大小和清晰度明显不同，有空间感。
  - id: m6-05
    'no': '6.5'
    title: 环境光反射
    duration: 3 小时
    outline: 让特效的颜色照到人物身上（新建图层剪辑到人物，用「添加」或「滤色」模式画边缘光）；投射阴影；接触面的光。
    pitfall: 特效很亮，人物身上却完全没有光，看起来像贴上去的。
    find: 用 6.3 的作品。
    homework: 给 6.3 的作品加上环境光。
    acceptance: 交加环境光前后的对比，人物朝向特效的一侧有明显的特效颜色。
- id: m7
  'no': 7
  title: 合成
  hours: 15
  level: 高阶
  summary: 换背景和合成，让人物和场景看起来在同一个空间里。
  note: null
  stage:
    title: 一张完整合成，逐项过检查表
    task: |
      按 [7.4 课](lesson:m7-04)的五个阶段做一张完整合成：草图 → 素材清单 → 合成 → 特效 → 统一调色。可以就是 7.4 课的作业，但阶段作业的检查更严：

      1. 做完以后打印 [7.2 课的合成检查表](lesson:m7-02#checklist)，按表格顺序一项一项检查，先写"检查结果"。
      2. 没过的项，回到 7.2 课对应的要素修正，再写"改了什么"，带上关键数值。
      3. 隔一天再从头过一遍检查表，第二遍发现的问题也写进去。

      这张作品可以直接当作[毕业作品](page:graduation/)里的合成那一张。
    time: 约 6 小时
    uses: [m7-01, m7-02, m7-03, m7-04]
    find: 按你的草图自己收集：人物照按 [7.4 课第 2 步](lesson:m7-04#assets)的拍摄单专门去拍；背景、配件自己拍，或者用免费图库，下载前读一遍授权条款，每一张都记下来源。网站不提供素材。
    acceptance:
      - 检查表七项全部打勾，每一项写了检查结果和改了什么；确实不用改的项写明"检查过，不用改，因为……"
      - 人物高度和按 [7.2 课公式](lesson:m7-02#perspective-why)算出来的高度相差不超过 5%，双脚落在能站人的地面上
      - 鞋底下有接触阴影；有投影的场景，投影的方向、长短、边缘软硬、深浅和背景里其他影子一致
      - 切成灰度看，人物最暗处、最亮处和旁边背景同类区域的亮度接近；放大到 200%，人物和背景的颗粒粗细差不多
      - 放大到 200% 沿人物边缘看一圈，没有白边、黑边；素材之间的接缝缩小、放大看都不明显
      - 成品和草图的视平线、主光方向一致；素材清单里每一张都写了来源和授权
    deliverables:
      - 构思草图
      - 素材清单（来源和授权）
      - 修图前后对比（人物原片和成品）
      - 填好的合成检查表（两遍）
      - 图层面板截图（按组整理）
  lessons:
  - id: m7-01
    'no': '7.1'
    title: 换背景
    duration: 3 小时
    outline: 抠图；选背景时要看视角、光向、焦段是否匹配；放置人物；处理边缘。
    pitfall: null
    find: 一张人像，再找一张想换上的背景图。两张的拍摄角度和光线方向要接近。
    homework: 给一张人像换背景。
    acceptance: 人物和背景的光向一致，边缘干净。
  - id: m7-02
    'no': '7.2'
    title: 合成五要素
    duration: 4 小时
    outline: 合成要对上五项：光源方向、透视、清晰度和景深、色彩、颗粒。另外还要加投影和接触阴影。
    pitfall: null
    find: 用 7.1 的作品。
    homework: 用检查表逐项检查 7.1 的作品，并修正。
    acceptance: 五项都打勾，每项写出修改了什么。
  - id: m7-03
    'no': '7.3'
    title: 漫展场照半合成
    duration: 4 小时
    outline: 保留人物和地面，替换上半部分背景，再加氛围。
    pitfall: null
    find: 一张漫展场照，地面完整、背景杂乱的最合适。
    homework: 完成一张场照半合成。
    acceptance: 看不出原本是漫展场地，地面接缝处自然。
  - id: m7-04
    'no': '7.4'
    title: 完整合成作品
    duration: 4 小时
    outline: 草图构思 → 收集素材 → 合成 → 特效 → 统一调色。
    pitfall: null
    find: 按你的构思自己收集人物照和背景图。
    homework: 一张完整的合成作品，作为毕业作品之一。
    acceptance: 通过 7.2 合成检查表的全部五项。
- id: m8
  'no': 8
  title: 风格和作品集
  hours: 10
  level: 高阶
  summary: 复刻、建立个人风格、整理作品集和接单交付。
  note: null
  stage:
    title: 作品集和接单说明
    task: |
      把整个课程的作业整理成能对外展示的东西：

      1. 按 [8.3 课](lesson:m8-03#pick)从作业里挑 6～9 张，排好顺序，每张做修图前后对比图。[毕业作品](page:graduation/)做完了的话，三张都可以放进来。
      2. 选一个要发布的平台，按 [8.3 课](lesson:m8-03#test)测一次压缩，按测试结果导出。
      3. 按 [8.4 课](lesson:m8-04#contract)写一份自己的接单说明：报价思路、修图尺度、修改次数、交付格式、交付时间。"擅长"一栏和你 [8.2 课的风格配方卡](lesson:m8-02#recipe)对得上。
      4. 把接单说明放进作品集主页的简介或置顶里。
    time: 约 4 小时
    uses: [m8-02, m8-03, m8-04]
    find: 不用找新图。用你之前的作业，每张都要能找到修图前的原片，并且确认出镜和摄影同意公开。
    acceptance:
      - 6～9 张，每张都有修图前后对比，两边大小一样、位置对齐，标注了修图前和修图后
      - 至少覆盖 3 种技能、至少 2 种色调，同一个角色不超过 2 张；第 1 张放的是最强的一张
      - 交了压缩测试记录，写明平台保存回来的尺寸和哪里变糊了；导出的图是 sRGB
      - 每张都有说明：角色、出镜、摄影、后期，和一句"这张修了什么"
      - 接单说明包含报价思路（附至少 3 张作业的实际用时）、修改次数（什么算一次、超出怎么办）、交付格式、交付时间
    deliverables:
      - 6～9 张对比图和发布顺序截图
      - 压缩测试记录
      - 每张的说明文字
      - 接单说明和用时统计表
  lessons:
  - id: m8-01
    'no': '8.1'
    title: 复刻练习
    duration: 3 小时
    outline: 怎么拆解别人的作品（取色、判断光影方向、推测调色思路）；复刻作品只用来练习，不发布，或者发布时注明是复刻。
    pitfall: null
    find: 2 张你喜欢的 cos 后期成品，只用来练习，不发布。
    homework: 复刻 2 张你喜欢的 cos 后期作品。
    acceptance: 交原作和复刻的并排对比，附拆解笔记。
  - id: m8-02
    'no': '8.2'
    title: 个人风格和预设
    duration: 3 小时
    outline: Lightroom 预设；Procreate 调色板和笔刷组；做一个预先建好图层组的 .procreate 模板文件，每次修图从模板开始。
    pitfall: null
    find: 不用找图。
    homework: 做出你自己的流程模板。
    acceptance: 交模板文件和一张用模板修好的照片。
  - id: m8-03
    'no': '8.3'
    title: 作品集
    duration: 2 小时
    outline: 选 6～9 张代表作；用修图前后对比展示；发布平台（微博、小红书、B 站、LOFTER）；导出尺寸和防止平台压缩变糊的方法。
    pitfall: null
    find: 你之前的作业。
    homework: 整理一份作品集。
    acceptance: 6～9 张，每张都有修图前后对比。
  - id: m8-04
    'no': '8.4'
    title: 接单交付
    duration: 2 小时
    outline: 报价思路；确认修图尺度；约定修改次数；交付格式；交付时间。
    pitfall: null
    find: 不用找图。
    homework: 写一份自己的接单说明。
    acceptance: 包含报价、修改次数、交付格式、交付时间四项。
