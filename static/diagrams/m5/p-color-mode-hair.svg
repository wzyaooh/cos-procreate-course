<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="颜色模式只换色相和饱和度，亮度要另外调" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>颜色模式只换色相和饱和度，亮度要另外调</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="300" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="25.0" width="284.0" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="45.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >「颜色」模式：换色相和饱和度，明暗不变</text><text x="40.0" y="114.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >实物偏橘的粉</text><rect x="180" y="80" width="70" height="56" rx="8" fill="#F59E8B" stroke="#1E293B" stroke-width="2"/><text x="215.0" y="156.0" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" >原来</text><text x="290.0" y="116.0" font-size="22" font-weight="800" fill="#1E293B" text-anchor="middle" >+</text><rect x="330" y="80" width="70" height="56" rx="8" fill="#F472B6" stroke="#1E293B" stroke-width="2"/><text x="365.0" y="156.0" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" >叠一层设定色（颜色模式）</text><text x="440.0" y="116.0" font-size="22" font-weight="800" fill="#1E293B" text-anchor="middle" >→</text><rect x="480" y="80" width="70" height="56" rx="8" fill="#FF8DC9" stroke="#1E293B" stroke-width="2"/><text x="515.0" y="156.0" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" >结果</text><text x="40.0" y="214.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >实物偏黄的银白</text><rect x="180" y="180" width="70" height="56" rx="8" fill="#E8DEC6" stroke="#1E293B" stroke-width="2"/><text x="215.0" y="256.0" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" >原来</text><text x="290.0" y="216.0" font-size="22" font-weight="800" fill="#1E293B" text-anchor="middle" >+</text><rect x="330" y="180" width="70" height="56" rx="8" fill="#DCE4F0" stroke="#1E293B" stroke-width="2"/><text x="365.0" y="256.0" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" >叠一层设定色（颜色模式）</text><text x="440.0" y="216.0" font-size="22" font-weight="800" fill="#1E293B" text-anchor="middle" >→</text><rect x="480" y="180" width="70" height="56" rx="8" fill="#D7DFEB" stroke="#1E293B" stroke-width="2"/><text x="515.0" y="256.0" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" >结果</text><rect x="566.0" y="99.0" width="102.0" height="25" rx="12.5" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="575.0" y="117.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >粉色：基本对了</text><rect x="566.0" y="199.0" width="162.0" height="25" rx="12.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="575.0" y="217.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >银白：偏差主要在饱和度，</text><rect x="566.0" y="227.0" width="138.0" height="25" rx="12.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="575.0" y="245.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >要配合降饱和、调亮度</text></svg>