<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="渐变映射按亮度把颜色换成渐变里的颜色" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>渐变映射按亮度把颜色换成渐变里的颜色</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="300" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="25.0" width="200.0" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="45.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >渐变映射：按亮度把颜色换掉</text><defs><linearGradient id="lg71" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#FFF"/></linearGradient><linearGradient id="lg72" x1="0" x2="1"><stop offset="0" stop-color="#1E1B4B"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient></defs><text x="60.0" y="100.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >照片的亮度</text><rect x="180" y="80" width="520" height="34" rx="6" fill="url(#lg71)" stroke="#1E293B" stroke-width="2"/><line x1="200.0" y1="120.0" x2="200.0" y2="160.0" stroke="#1E293B" stroke-width="2" marker-end="url(#arw)"/><line x1="320.0" y1="120.0" x2="320.0" y2="160.0" stroke="#1E293B" stroke-width="2" marker-end="url(#arw)"/><line x1="440.0" y1="120.0" x2="440.0" y2="160.0" stroke="#1E293B" stroke-width="2" marker-end="url(#arw)"/><line x1="560.0" y1="120.0" x2="560.0" y2="160.0" stroke="#1E293B" stroke-width="2" marker-end="url(#arw)"/><line x1="680.0" y1="120.0" x2="680.0" y2="160.0" stroke="#1E293B" stroke-width="2" marker-end="url(#arw)"/><text x="60.0" y="190.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >换成的颜色</text><rect x="180" y="168" width="520" height="34" rx="6" fill="url(#lg72)" stroke="#1E293B" stroke-width="2"/><text x="180.0" y="232.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >最暗的地方 → 左端颜色</text><text x="700.0" y="232.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="end" >最亮的地方 → 右端颜色</text><text x="380.0" y="266.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle" >整张图被换成一套配色，再降低不透明度或换成柔光模式叠回去，就是"统一氛围"</text></svg>