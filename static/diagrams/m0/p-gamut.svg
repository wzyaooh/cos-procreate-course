<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="色域示意：P3 比 sRGB 能显示更多饱和的颜色" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>色域示意：P3 比 sRGB 能显示更多饱和的颜色</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="340" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><path d="M120 280 L250 50 L400 280 Z" fill="#C4B5FD" fill-opacity="0.35" stroke="#6D28D9" stroke-width="3" /><path d="M140 265 L245 85 L370 268 Z" fill="#34D399" fill-opacity="0.35" stroke="#047857" stroke-width="3" stroke-dasharray="7 5"/><rect x="270.0" y="47.0" width="99.2" height="27" rx="13.5" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="279.0" y="67.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >Display P3</text><rect x="196.0" y="191.0" width="50.5" height="27" rx="13.5" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="205.0" y="211.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >sRGB</text><circle cx="252" cy="62" r="7" fill="#EF4444" stroke="#1E293B" stroke-width="2"/><text x="440.0" y="80.0" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="start" >外圈：P3 能显示的颜色</text><text x="440.0" y="106.0" font-size="15" font-weight="700" fill="#047857" text-anchor="start" >内圈：sRGB 能显示的颜色</text><text x="440.0" y="150.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >红点：只有 P3 才有的</text><text x="440.0" y="174.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >很饱和的绿、红、橙</text><text x="440.0" y="218.0" font-size="15" font-weight="600" fill="#64748B" text-anchor="start" >不支持 P3 的平台和设备</text><text x="440.0" y="242.0" font-size="15" font-weight="600" fill="#64748B" text-anchor="start" >会把它挤进 sRGB 里显示，</text><text x="440.0" y="266.0" font-size="15" font-weight="600" fill="#64748B" text-anchor="start" >颜色就变灰、变淡或偏了。</text></svg>