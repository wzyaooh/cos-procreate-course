<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="把一张作品拖到另一张上，叠成一个堆" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>把一张作品拖到另一张上，叠成一个堆</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="800" height="560" fill="#FFFDF5"/><rect x="0" y="0" width="800" height="560" rx="30" fill="#1E293B"/><rect x="14" y="14" width="772" height="532" rx="16" fill="#1F2329"/><text x="40.0" y="52.0" font-size="22" font-weight="800" fill="#E5E7EB" text-anchor="start" >Procreate</text><text x="520.0" y="52.0" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="middle" >选择</text><text x="588.0" y="52.0" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="middle" >导入</text><text x="656.0" y="52.0" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="middle" >照片</text><text x="730.0" y="52.0" font-size="30" font-weight="700" fill="#E5E7EB" text-anchor="middle" >+</text><rect x="60" y="100" width="140" height="160" rx="6" fill="#FFF7E6"/><path d="M130.0 252 q-14 -40 0 -70 q14 30 0 70" fill="#F472B6" stroke="#1E293B" stroke-width="1.5"/><text x="60.0" y="280.0" font-size="13" font-weight="600" fill="#E5E7EB" text-anchor="start" >雷电将军_02</text><rect x="56" y="96" width="148" height="168" rx="8" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/><g transform="translate(190 120) rotate(-6)"><rect x="0" y="0" width="140" height="160" rx="6" fill="#FFF7E6" opacity=".85"/><path d="M70 152 q-14 -40 0 -70 q14 30 0 70" fill="#F472B6" stroke="#1E293B" stroke-width="1.5"/></g><ellipse cx="270" cy="210" rx="10" ry="13" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><rect x="370" y="100" width="140" height="160" rx="6" fill="#FFF7E6"/><path d="M440.0 252 q-14 -40 0 -70 q14 30 0 70" fill="#F472B6" stroke="#1E293B" stroke-width="1.5"/><text x="370.0" y="280.0" font-size="13" font-weight="600" fill="#E5E7EB" text-anchor="start" >雷电将军_01</text><rect x="364" y="94" width="152" height="172" rx="9" fill="none" stroke="#2563EB" stroke-width="4"/><line x1="290.0" y1="200.0" x2="356.0" y2="190.0" stroke="#FBBF24" stroke-width="4" marker-end="url(#arw)"/><circle cx="240" cy="108" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="240.0" y="113.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >1</text><circle cx="500" cy="108" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="500.0" y="113.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >2</text><rect x="588" y="102" width="140" height="160" rx="6" fill="#FFF7E6" stroke="#1E293B" stroke-width="1.5"/><rect x="582" y="108" width="140" height="160" rx="6" fill="#FFF7E6" stroke="#1E293B" stroke-width="1.5"/><rect x="576" y="114" width="140" height="160" rx="6" fill="#FFF7E6" stroke="#1E293B" stroke-width="1.5"/><path d="M646 260 q-14 -40 0 -70 q14 30 0 70" fill="#F472B6" stroke="#1E293B" stroke-width="1.5"/><text x="576.0" y="300.0" font-size="12" font-weight="700" fill="#E5E7EB" text-anchor="start" >堆 → 改名「雷电将军_20261021」</text><line x1="520.0" y1="180.0" x2="566.0" y2="180.0" stroke="#E5E7EB" stroke-width="3" marker-end="url(#arw)"/><rect x="40.0" y="341.0" width="386.5" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="49.0" y="361.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >① 按住一张作品拖起来  ② 拖到另一张上，它变蓝时松手</text><rect x="40.0" y="377.0" width="354.0" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="49.0" y="397.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >两张叠成一个「堆」；名字默认叫「堆」，轻点名字改</text><rect x="40.0" y="413.0" width="314.2" height="27" rx="13.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="49.0" y="433.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >也可以：「选择」勾上几张 → 点顶上的「堆」</text><rect x="40.0" y="449.0" width="396.0" height="27" rx="13.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="49.0" y="469.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >往已有的堆里加：拖到堆上多停一会儿，等它闪两下再进去放</text><text x="774.0" y="536.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="end" >示意图</text></svg>