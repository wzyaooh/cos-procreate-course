<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="画布像素数对比：6000×4000、4500×3000、3000×2000" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>画布像素数对比：6000×4000、4500×3000、3000×2000</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="340" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><text x="44.0" y="46.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >同一张照片，三种长边尺寸：面积按像素数等比例画</text><rect x="44" y="70" width="240" height="160" fill="#EDE9FE" stroke="#1E293B" stroke-width="2.5"/><text x="52.0" y="94.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >6000 × 4000</text><text x="52.0" y="116.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >= 24.0 百万像素</text><text x="44.0" y="254.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >相机原图</text><text x="44.0" y="276.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >是原图的 100%</text><rect x="310.0" y="70" width="180" height="120" fill="#D1FAE5" stroke="#1E293B" stroke-width="2.5"/><text x="318.0" y="94.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >4500 × 3000</text><text x="318.0" y="116.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >= 13.5 百万像素</text><text x="310.0" y="214.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >缩到长边 4500</text><text x="310.0" y="236.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >是原图的 56%</text><rect x="516.0" y="70" width="120" height="80" fill="#FEF3C7" stroke="#1E293B" stroke-width="2.5"/><text x="524.0" y="94.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >3000 × 2000</text><text x="524.0" y="116.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >= 6.0 百万像素</text><text x="516.0" y="174.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >缩到长边 3000</text><text x="516.0" y="196.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >是原图的 25%</text><text x="44.0" y="312.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >每个图层都要存一整张画布大小的图。像素越少，每层占的内存越少，能开的层数越多；具体多少以画布信息为准。</text></svg>