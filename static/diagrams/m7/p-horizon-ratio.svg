<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="用背景里已知高度的门量出镜头高度，再算出人物在这个位置应该多高" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>用背景里已知高度的门量出镜头高度，再算出人物在这个位置应该多高</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="420" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="400" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="24.0" width="243.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >用门量出镜头高度，再算人该多高</text><defs><clipPath id="c47"><rect x="36.0" y="58.0" width="420.0" height="336.0"/></clipPath></defs><g clip-path="url(#c47)"><defs><linearGradient id="sky46" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient></defs><rect x="36" y="58" width="420" height="134.4" fill="url(#sky46)"/><path d="M36 192.4 Q120.0 152.1 212.4 182.3 Q296.4 138.6 380.4 179.0 Q422.4 165.5 456 185.7 L456 192.4 Z" fill="#A7C4BC" stroke="#1E293B" stroke-width="1.5"/><rect x="36" y="192.4" width="420" height="201.6" fill="#BBE5A8"/><line x1="36" y1="192.4" x2="456" y2="192.4" stroke="#1E293B" stroke-width="1.5"/><path d="M286.0 192.4 L290.0 192.4 L363.6 394 L162.0 394 Z" fill="#F5E6C8" stroke="#1E293B" stroke-width="2"/><rect x="76" y="156.56000000000003" width="46" height="143.4" fill="#FEF3C7" stroke="#1E293B" stroke-width="3"/><rect x="81.5" y="162.1" width="35.0" height="137.8" fill="none" stroke="#1E293B" stroke-width="2"/><circle cx="111.9" cy="248.2" r="5" fill="#1E293B"/><path d="M303.6 187.0 Q298.9 220.4 307.1 230.5 L336.1 230.5 Q344.3 220.4 339.6 187.0 Z" fill="#F472B6" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/><rect x="317.8" y="199.0" width="7.6" height="18.2" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><rect x="313.5" y="272.5" width="8.7" height="99.5" rx="3.5" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><path d="M315.6 325.2 q2.2 5 4.4 0" fill="none" stroke="#1E293B" stroke-width="1.4" stroke-linecap="round"/><rect x="322.2" y="272.5" width="8.7" height="99.5" rx="3.5" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><path d="M324.4 325.2 q2.2 5 4.4 0" fill="none" stroke="#1E293B" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="317.8" cy="374.6" rx="7.0" ry="3.2" fill="#1E293B"/><ellipse cx="326.5" cy="374.6" rx="7.0" ry="3.2" fill="#1E293B"/><path d="M298.4 213.1 Q321.6 207.1 344.8 213.1 L336.1 258.1 L307.1 258.1 Z" fill="#C4B5FD" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/><path d="M298.9 217.1 Q292.6 246.5 294.9 274.1" fill="none" stroke="#1E293B" stroke-width="7.0" stroke-linecap="round"/><path d="M298.9 217.1 Q292.6 246.5 294.9 274.1" fill="none" stroke="#FDE2CF" stroke-width="3.0" stroke-linecap="round"/><path d="M344.3 217.1 Q350.6 246.5 348.3 274.1" fill="none" stroke="#1E293B" stroke-width="7.0" stroke-linecap="round"/><path d="M344.3 217.1 Q350.6 246.5 348.3 274.1" fill="none" stroke="#FDE2CF" stroke-width="3.0" stroke-linecap="round"/><path d="M307.1 258.1 L336.1 258.1 L347.7 281.4 L295.5 281.4 Z" fill="#8B5CF6" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/><line x1="307.1" y1="258.1" x2="336.1" y2="258.1" stroke="#1E293B" stroke-width="4"/><ellipse cx="321.6" cy="189.9" rx="11.6" ry="13.6" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><path d="M305.6 189.9 Q307.1 171.6 321.6 173.3 Q336.1 171.6 337.6 189.9 Q327.4 179.7 318.7 183.2 Q312.9 181.2 305.6 189.9 Z" fill="#F472B6" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/><circle cx="317.0" cy="191.9" r="1.5" fill="#1E293B"/><circle cx="326.2" cy="191.9" r="1.5" fill="#1E293B"/></g><rect x="36" y="58" width="420" height="336" fill="none" stroke="#1E293B" stroke-width="2"/><line x1="36.0" y1="192.4" x2="456.0" y2="192.4" stroke="#6D28D9" stroke-width="3" stroke-dasharray="8 6"/><rect x="391.0" y="164.4" width="57.0" height="26" rx="13.0" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="400.0" y="183.4" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >视平线</text><line x1="140.0" y1="192.4" x2="140.0" y2="299.9" stroke="#B91C1C" stroke-width="2"/><line x1="134.0" y1="192.4" x2="146.0" y2="192.4" stroke="#B91C1C" stroke-width="2"/><line x1="134.0" y1="299.9" x2="146.0" y2="299.9" stroke="#B91C1C" stroke-width="2"/><text x="149.0" y="251.2" font-size="16" font-weight="800" fill="#B91C1C" text-anchor="start" >a</text><line x1="66.0" y1="156.6" x2="66.0" y2="299.9" stroke="#6D28D9" stroke-width="2"/><line x1="60.0" y1="156.6" x2="72.0" y2="156.6" stroke="#6D28D9" stroke-width="2"/><line x1="60.0" y1="299.9" x2="72.0" y2="299.9" stroke="#6D28D9" stroke-width="2"/><text x="57.0" y="233.2" font-size="16" font-weight="800" fill="#6D28D9" text-anchor="end" >b</text><line x1="365.6" y1="192.4" x2="365.6" y2="377.2" stroke="#B91C1C" stroke-width="2"/><line x1="359.6" y1="192.4" x2="371.6" y2="192.4" stroke="#B91C1C" stroke-width="2"/><line x1="359.6" y1="377.2" x2="371.6" y2="377.2" stroke="#B91C1C" stroke-width="2"/><text x="374.6" y="289.8" font-size="16" font-weight="800" fill="#B91C1C" text-anchor="start" >d</text><line x1="277.6" y1="173.9" x2="277.6" y2="377.2" stroke="#6D28D9" stroke-width="2"/><line x1="271.6" y1="173.9" x2="283.6" y2="173.9" stroke="#6D28D9" stroke-width="2"/><line x1="271.6" y1="377.2" x2="283.6" y2="377.2" stroke="#6D28D9" stroke-width="2"/><text x="268.6" y="280.6" font-size="14" font-weight="800" fill="#6D28D9" text-anchor="end" >人高</text><text x="476.0" y="92.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >1. 量门</text><text x="476.0" y="115.0" font-size="15" font-weight="400" fill="#1E293B" text-anchor="start" >a = 门底到视平线</text><text x="476.0" y="138.0" font-size="15" font-weight="400" fill="#1E293B" text-anchor="start" >b = 门的高度（约 2 米）</text><text x="476.0" y="161.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >镜头高度 = 2 米 × a ÷ b</text><text x="476.0" y="184.0" font-size="15" font-weight="400" fill="#1E293B" text-anchor="start" ></text><text x="476.0" y="207.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >2. 算人</text><text x="476.0" y="230.0" font-size="15" font-weight="400" fill="#1E293B" text-anchor="start" >d = 人的脚底到视平线</text><text x="476.0" y="253.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >人高 = d × 身高 ÷ 镜头高度</text><text x="476.0" y="276.0" font-size="15" font-weight="400" fill="#1E293B" text-anchor="start" ></text><text x="476.0" y="299.0" font-size="15" font-weight="400" fill="#1E293B" text-anchor="start" >例：a = 60，b = 80</text><text x="476.0" y="322.0" font-size="15" font-weight="400" fill="#1E293B" text-anchor="start" >→ 镜头 = 2 × 60 ÷ 80 = 1.5 米</text><text x="476.0" y="345.0" font-size="15" font-weight="400" fill="#1E293B" text-anchor="start" >身高 1.65 米，d = 100</text><text x="476.0" y="368.0" font-size="15" font-weight="400" fill="#1E293B" text-anchor="start" >→ 人高 = 100 × 1.65 ÷ 1.5 = 110</text><text x="476.0" y="396.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="start" >a、b、d 都是照片上量的长度，单位随意</text></svg>