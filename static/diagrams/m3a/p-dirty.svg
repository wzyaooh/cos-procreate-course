<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="往肤色里混入互补色和灰色" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>往肤色里混入互补色和灰色</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="400" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="380" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="24.0" width="338.4" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >肤色为什么会"脏"：往橙色里混进了它的对面色</text><text x="44.0" y="80.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >肤色 + 蓝紫（冷色补光、蓝背景反光、调冷过头）</text><rect x="44" y="92" width="92" height="50" rx="6" fill="#E0B394" stroke="#1E293B" stroke-width="2"/><text x="90.0" y="158.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 0%</text><text x="90.0" y="173.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H24 S34 B88</text><rect x="156" y="92" width="92" height="50" rx="6" fill="#D2AC95" stroke="#1E293B" stroke-width="2"/><text x="202.0" y="158.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 10%</text><text x="202.0" y="173.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H23 S29 B82</text><rect x="268" y="92" width="92" height="50" rx="6" fill="#C5A596" stroke="#1E293B" stroke-width="2"/><text x="314.0" y="158.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 20%</text><text x="314.0" y="173.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H19 S24 B77</text><rect x="380" y="92" width="92" height="50" rx="6" fill="#B79F97" stroke="#1E293B" stroke-width="2"/><text x="426.0" y="158.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 30%</text><text x="426.0" y="173.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H15 S17 B72</text><rect x="492" y="92" width="92" height="50" rx="6" fill="#A99898" stroke="#1E293B" stroke-width="2"/><text x="538.0" y="158.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 40%</text><text x="538.0" y="173.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H0 S10 B66</text><rect x="604" y="92" width="92" height="50" rx="6" fill="#9C9199" stroke="#1E293B" stroke-width="2"/><text x="650.0" y="158.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 50%</text><text x="650.0" y="173.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H316 S7 B61</text><text x="44.0" y="216.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >肤色 + 灰（用灰色/黑色画笔压暗、降饱和过头）</text><rect x="44" y="228" width="92" height="50" rx="6" fill="#E0B394" stroke="#1E293B" stroke-width="2"/><text x="90.0" y="294.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 0%</text><text x="90.0" y="309.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H24 S34 B88</text><rect x="156" y="228" width="92" height="50" rx="6" fill="#D8AF93" stroke="#1E293B" stroke-width="2"/><text x="202.0" y="294.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 10%</text><text x="202.0" y="309.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H24 S32 B85</text><rect x="268" y="228" width="92" height="50" rx="6" fill="#CFAB92" stroke="#1E293B" stroke-width="2"/><text x="314.0" y="294.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 20%</text><text x="314.0" y="309.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H25 S29 B81</text><rect x="380" y="228" width="92" height="50" rx="6" fill="#C7A792" stroke="#1E293B" stroke-width="2"/><text x="426.0" y="294.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 30%</text><text x="426.0" y="309.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H24 S27 B78</text><rect x="492" y="228" width="92" height="50" rx="6" fill="#BEA391" stroke="#1E293B" stroke-width="2"/><text x="538.0" y="294.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 40%</text><text x="538.0" y="309.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H24 S24 B75</text><rect x="604" y="228" width="92" height="50" rx="6" fill="#B6A090" stroke="#1E293B" stroke-width="2"/><text x="650.0" y="294.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle" >混入 50%</text><text x="650.0" y="309.0" font-size="11" font-weight="400" fill="#64748B" text-anchor="middle" >H25 S21 B71</text><text x="44.0" y="352.0" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start" >两种情况都是饱和度先掉下来：S 从 34 掉到 20 以下，皮肤就发灰；</text><text x="44.0" y="374.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >混蓝紫时色相还会往 0° 以下（品红那边）跑，于是又灰又紫，看起来像冻着了或者没洗干净</text></svg>