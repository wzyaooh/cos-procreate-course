<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="去黄的三个方向" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>去黄的三个方向</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="360" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="340" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="24.0" width="243.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >偏黄发灰的肤色：先往哪个方向拉</text><rect x="60" y="150" width="110" height="80" rx="6" fill="#C2B299" stroke="#1E293B" stroke-width="2"/><text x="115.0" y="246.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >原来：偏黄发灰</text><text x="115.0" y="261.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >H37 S21 B76</text><line x1="184.0" y1="190.0" x2="290.0" y2="94.0" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arw)"/><rect x="300" y="64" width="90" height="60" rx="6" fill="#C2B2A5" stroke="#1E293B" stroke-width="2"/><text x="404.0" y="84.0" font-size="14" font-weight="800" fill="#B91C1C" text-anchor="start" >颜色平衡往「蓝色」拉</text><text x="404.0" y="106.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >H27 S15 B76</text><text x="404.0" y="126.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="start" >色相回来了，但饱和度掉了 → 更灰</text><line x1="184.0" y1="190.0" x2="290.0" y2="186.0" stroke="#047857" stroke-width="2.5" marker-end="url(#arw)"/><rect x="300" y="156" width="90" height="60" rx="6" fill="#C2AB99" stroke="#1E293B" stroke-width="2"/><text x="404.0" y="176.0" font-size="14" font-weight="800" fill="#047857" text-anchor="start" >颜色平衡往「紫红色」拉</text><text x="404.0" y="198.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >H26 S21 B76</text><text x="404.0" y="218.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="start" >色相回到橙色，饱和度不变</text><line x1="184.0" y1="190.0" x2="290.0" y2="278.0" stroke="#047857" stroke-width="2.5" marker-end="url(#arw)"/><rect x="300" y="248" width="90" height="60" rx="6" fill="#D6AE90" stroke="#1E293B" stroke-width="2"/><text x="404.0" y="268.0" font-size="14" font-weight="800" fill="#047857" text-anchor="start" >再用「色相、饱和度和亮度」加饱和度</text><text x="404.0" y="290.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >H26 S33 B84</text><text x="404.0" y="310.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="start" >色相不动，饱和度、亮度回来 → 干净</text><text x="44.0" y="340.0" font-size="12.5" font-weight="700" fill="#1E293B" text-anchor="start" >红绿太接近（绿多了）的蜡黄：只加蓝等于往橙色里加互补色，越修越灰。先往紫红拉回色相，再单独补饱和度。</text></svg>