 >黄圈：反光（右下）比灰面（左上）暗</text><text x="580.0" y="306.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >边缘发白，像一个空心的泡泡</text><text x="580.0" y="328.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="middle" >修图时把下颌、脸侧提得太亮就会这样</text></svg>