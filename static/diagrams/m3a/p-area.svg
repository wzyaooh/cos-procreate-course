<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="配色的面积、互补平衡和冷暖主调" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>配色的面积、互补平衡和冷暖主调</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="380" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="360" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="24.0" width="393.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >配色三条法则：面积有主次、互补要平衡、冷暖要有主调</text><text x="44.0" y="80.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >① 面积：主色约 70%，辅色约 25%，点缀约 5%</text><rect x="44.0" y="92" width="462.0" height="44" fill="#344373" stroke="#1E293B" stroke-width="2"/><rect x="506.0" y="92" width="165.0" height="44" fill="#D8DEEB" stroke="#1E293B" stroke-width="2"/><rect x="671.0" y="92" width="33.0" height="44" fill="#F2BF24" stroke="#1E293B" stroke-width="2"/><text x="275.0" y="156.0" font-size="12.5" font-weight="700" fill="#1E293B" text-anchor="middle" >主色：深蓝（制服）</text><text x="588.0" y="156.0" font-size="12.5" font-weight="700" fill="#1E293B" text-anchor="middle" >辅色：白</text><text x="688.0" y="156.0" font-size="12.5" font-weight="700" fill="#1E293B" text-anchor="end" >点缀：金</text><text x="44.0" y="196.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >② 互补平衡：一对互补色，一个面积大就降饱和，一个面积小可以很鲜艳</text><rect x="44" y="210" width="300" height="56" fill="#4C6280" stroke="#1E293B" stroke-width="2"/><rect x="300" y="224" width="30" height="28" fill="#FA830C" stroke="#1E293B" stroke-width="2"/><text x="194.0" y="286.0" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle" >对：大面积灰蓝 + 小块亮橙</text><rect x="404" y="210" width="150" height="56" fill="#0B66E6" stroke="#1E293B" stroke-width="2"/><rect x="554" y="210" width="150" height="56" fill="#FA830C" stroke="#1E293B" stroke-width="2"/><text x="554.0" y="286.0" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle" >刺眼：两个都满饱和、面积一样</text><text x="44.0" y="326.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >③ 冷暖主调：整张图要么偏冷要么偏暖，另一边只占小面积。肤色属于暖色，冷调照片里也要留住它的暖</text></svg>