</text><text x="300.0" y="205.0" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" stroke="#EAB308" stroke-width="3" paint-order="stroke">黄色</text><text x="267.8" y="282.8" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" stroke="#22C55E" stroke-width="3" paint-order="stroke">绿色</text><text x="190.0" y="315.0" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" stroke="#14B8A6" stroke-width="3" paint-order="stroke">浅绿色</text><text x="112.2" y="282.8" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" stroke="#3B82F6" stroke-width="3" paint-order="stroke">蓝色</text><text x="80.0" y="205.0" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" stroke="#8B5CF6" stroke-width="3" paint-order="stroke">紫色</text><text x="112.2" y="127.2" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" stroke="#D946EF" stroke-width="3" paint-order="stroke">洋红</text><text x="190.0" y="205.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="middle" >肤色</text><text x="190.0" y="225.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" >挤在橙色</text><text x="380.0" y="60.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >选中「橙色」以后：</text><rect x="380.0" y="81.0" width="46.0" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="389.0" y="101.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >色相</text><text x="470.0" y="98.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >往左：偏红、偏粉（健康）</text><text x="470.0" y="120.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >往右：偏黄（容易蜡黄）</text><rect x="380.0" y="151.0" width="60.0" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="389.0" y="171.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >饱和度</text><text x="470.0" y="168.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >往左：淡、苍白</text><text x="470.0" y="190.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >往右：浓、像晒伤</text><rect x="380.0" y="221.0" width="60.0" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="389.0" y="241.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >明亮度</text><text x="470.0" y="238.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >往左：暗、脏</text><text x="470.0" y="260.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >往右：透亮（别超过 +20）</text><text x="380.0" y="320.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >为什么不直接调「饱和度」：它会让假发、衣服、</text><text x="380.0" y="342.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >背景一起变。混合只动这一格颜色，别的不受影响。</text></svg>