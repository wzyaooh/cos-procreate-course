<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-label="白平衡：色温管蓝黄，色调管绿和洋红，偏哪边往反方向推" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>白平衡：色温管蓝黄，色调管绿和洋红，偏哪边往反方向推</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="780" height="420" fill="#FFFDF5"/><rect x="10" y="10" width="760" height="400" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><text x="40.0" y="50.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >照片里本来是白色、灰色的东西，R、G、B 应该一样多。偏了哪边，就往反方向推。</text><defs><linearGradient id="wbT"><stop offset="0" stop-color="#4F8DF5"/><stop offset="1" stop-color="#F5C542"/></linearGradient><linearGradient id="wbG"><stop offset="0" stop-color="#4CC27A"/><stop offset="1" stop-color="#D24CC2"/></linearGradient></defs><text x="40.0" y="106.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >色温</text><rect x="110" y="90" width="420" height="22" rx="11" fill="url(#wbT)" stroke="#1E293B" stroke-width="2"/><text x="110.0" y="132.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >偏蓝（冷）</text><text x="530.0" y="132.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="end" >偏黄（暖）</text><line x1="320" y1="86" x2="320" y2="116" stroke="#1E293B" stroke-width="2"/><text x="40.0" y="176.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >色调</text><rect x="110" y="160" width="420" height="22" rx="11" fill="url(#wbG)" stroke="#1E293B" stroke-width="2"/><text x="110.0" y="202.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >偏绿</text><text x="530.0" y="202.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="end" >偏洋红</text><line x1="320" y1="156" x2="320" y2="186" stroke="#1E293B" stroke-width="2"/><rect x="40" y="250" width="70" height="70" rx="8" fill="#F7E3A6" stroke="#1E293B" stroke-width="2"/><line x1="118.0" y1="285.0" x2="158.0" y2="285.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><rect x="164" y="250" width="70" height="70" rx="8" fill="#F8F8F6" stroke="#1E293B" stroke-width="2"/><text x="40.0" y="344.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >漫展暖光：白墙发黄</text><text x="40.0" y="366.0" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="start" >色温往左（蓝）</text><rect x="286" y="250" width="70" height="70" rx="8" fill="#C9DDF7" stroke="#1E293B" stroke-width="2"/><line x1="364.0" y1="285.0" x2="404.0" y2="285.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><rect x="410" y="250" width="70" height="70" rx="8" fill="#F8F8F6" stroke="#1E293B" stroke-width="2"/><text x="286.0" y="344.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >阴天、屏幕光：发蓝</text><text x="286.0" y="366.0" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="start" >色温往右（黄）</text><rect x="532" y="250" width="70" height="70" rx="8" fill="#EFC9EA" stroke="#1E293B" stroke-width="2"/><line x1="610.0" y1="285.0" x2="650.0" y2="285.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><rect x="656" y="250" width="70" height="70" rx="8" fill="#F8F8F6" stroke="#1E293B" stroke-width="2"/><text x="532.0" y="344.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >LED 灯：发紫发粉</text><text x="532.0" y="366.0" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="start" >色调往左（绿）</text><text x="560.0" y="106.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >白平衡选择器（吸管）</text><text x="560.0" y="128.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >= 告诉软件"这里应该是灰色"，</text><text x="560.0" y="148.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >它自动把色温、色调推回去。</text><text x="560.0" y="178.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >吸在白衬衫、白墙、灰地面上；</text><text x="560.0" y="198.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >别吸皮肤、假发和彩色灯牌。</text><text x="40.0" y="396.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >RAW 照片的色温显示开尔文数值（K），JPG 显示 -100～+100，方向是一样的。</text></svg>