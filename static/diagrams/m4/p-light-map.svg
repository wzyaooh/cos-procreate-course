"#64748B" text-anchor="start" >背光一侧的暗区可以再深一点。</text><text x="440.0" y="430.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >这张图是正面平光的通用位置，</text><text x="440.0" y="452.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >实际照片要先看原本的光在哪（3.1 课）。</text></svg>