ke" /><path d="M-0.24,0.6 Q0,0.64 0.24,0.6 Q0.12,0.75 0,0.75 Q-0.12,0.75 -0.24,0.6 Z" fill="#E0607A" fill-opacity="1.0" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" /></g></g></g></g></g><g transform="translate(240,250) scale(140)"><path d="M-0.98,-0.3 C-1.0,-1.0 -0.6,-1.3 0,-1.3 C0.6,-1.3 1.0,-1.0 0.98,-0.3 C0.9,-0.75 0.6,-1.02 0,-1.05 C-0.6,-1.02 -0.9,-0.75 -0.98,-0.3 Z" fill="#F472B6" fill-opacity="1.0" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" /></g><line x1="65" y1="103" x2="429" y2="103" stroke="#047857" stroke-width="2.5" stroke-dasharray="7 5"/><text x="436.0" y="108.0" font-size="12" font-weight="800" fill="#047857" text-anchor="start" >发际线</text><line x1="65" y1="197" x2="429" y2="197" stroke="#047857" stroke-width="2.5" stroke-dasharray="7 5"/><text x="436.0" y="201.8" font-size="12" font-weight="800" fill="#047857" text-anchor="start" >眉毛</text><line x1="65" y1="299" x2="429" y2="299" stroke="#047857" stroke-width="2.5" stroke-dasharray="7 5"/><text x="436.0" y="304.0" font-size="12" font-weight="800" fill="#047857" text-anchor="start" >鼻底</text><line x1="65" y1="394" x2="429" y2="394" stroke="#047857" stroke-width="2.5" stroke-dasharray="7 5"/><text x="436.0" y="399.2" font-size="12" font-weight="800" fill="#047857" text-anchor="start" >下巴</text><rect x="37.0" y="138.9" width="42.0" height="25" rx="12.5" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="46.0" y="156.9" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >上庭</text><rect x="37.0" y="236.9" width="42.0" height="25" rx="12.5" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="46.0" y="254.9" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >中庭</text><rect x="37.0" y="335.6" width="42.0" height="25" rx="12.5" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="46.0" y="353.6" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >下庭</text><line x1="103" y1="208" x2="103" y2="253" stroke="#6D28D9" stroke-width="2.5"/><line x1="156" y1="208" x2="156" y2="253" stroke="#6D28D9" stroke-width="2.5"/><line x1="212" y1="208" x2="212" y2="253" stroke="#6D28D9" stroke-width="2.5"/><line x1="268" y1="208" x2="268" y2="253" stroke="#6D28D9" stroke-width="2.5"/><line x1="324" y1="208" x2="324" y2="253" stroke="#6D28D9" stroke-width="2.5"/><line x1="377" y1="208" x2="377" y2="253" stroke="#6D28D9" stroke-width="2.5"/><text x="129.4" y="271.0" font-size="13" font-weight="900" fill="#6D28D9" text-anchor="middle" >1</text><text x="184.0" y="271.0" font-size="13" font-weight="900" fill="#6D28D9" text-anchor="middle" >2</text><text x="240.0" y="271.0" font-size="13" font-weight="900" fill="#6D28D9" text-anchor="middle" >3</text><text x="296.0" y="271.0" font-size="13" font-weight="900" fill="#6D28D9" text-anchor="middle" >4</text><text x="350.6" y="271.0" font-size="13" font-weight="900" fill="#6D28D9" text-anchor="middle" >5</text><rect x="480.0" y="41.0" width="172.0" height="27" rx="13.5" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="489.0" y="61.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >三庭：竖着三段差不多长</text><text x="480.0" y="94.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >发际线→眉毛→鼻底→下巴</text><text x="480.0" y="118.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >下庭稍长一点（约 1 : 1 : 1.1）更上镜</text><rect x="480.0" y="147.0" width="158.0" height="27" rx="13.5" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="489.0" y="167.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >五眼：横着五个眼睛宽</text><text x="480.0" y="200.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >两眼中间正好放下一只眼</text><text x="480.0" y="224.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >眼尾到脸边各一只眼</text><rect x="480.0" y="259.0" width="188.2" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="489.0" y="279.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >修图时只用来找"哪里偏了"</text><text x="480.0" y="312.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >真人脸不会完全标准，标准反而没特点。</text><text x="480.0" y="336.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >只修明显的不对称：一只眼小一圈、</text><text x="480.0" y="360.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >一边嘴角低、一边下颌宽。</text><text x="480.0" y="394.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >每次改动不超过一个眼睛宽的 1/10，</text><text x="480.0" y="418.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >改完和原图来回对比，还认得出是本人。</text><text x="480.0" y="460.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start" >修脸型之前先问 coser（0.3 课沟通表）。</text></svg>