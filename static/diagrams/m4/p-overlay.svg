dth="60" height="48" rx="6" fill="#FDE2CF" stroke="#1E293B" stroke-width="1.5"/><text x="596.0" y="124.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >中性灰（50%）</text><text x="596.0" y="144.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >看不出来，等于没涂</text><rect x="420" y="174" width="60" height="48" rx="6" fill="#FDE2CF" stroke="#1E293B" stroke-width="1.5"/><line x1="486.0" y1="198.0" x2="516.0" y2="198.0" stroke="#1E293B" stroke-width="2" marker-end="url(#arw)"/><rect x="522" y="174" width="60" height="48" rx="6" fill="#FDE3D1" stroke="#1E293B" stroke-width="1.5"/><text x="596.0" y="194.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >10% 的白</text><text x="596.0" y="214.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >亮了一点点</text><rect x="420" y="244" width="60" height="48" rx="6" fill="#FDE2CF" stroke="#1E293B" stroke-width="1.5"/><line x1="486.0" y1="268.0" x2="516.0" y2="268.0" stroke="#1E293B" stroke-width="2" marker-end="url(#arw)"/><rect x="522" y="244" width="60" height="48" rx="6" fill="#FDDFCB" stroke="#1E293B" stroke-width="1.5"/><text x="596.0" y="264.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >10% 的黑</text><text x="596.0" y="284.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >暗了一点点</text><rect x="420" y="314" width="60" height="48" rx="6" fill="#FDE2CF" stroke="#1E293B" stroke-width="1.5"/><line x1="486.0" y1="338.0" x2="516.0" y2="338.0" stroke="#1E293B" stroke-width="2" marker-end="url(#arw)"/><rect x="522" y="314" width="60" height="48" rx="6" fill="#FBC8A8" stroke="#1E293B" stroke-width="1.5"/><text x="596.0" y="334.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >100% 的黑</text><text x="596.0" y="354.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >暗得发脏，所以要低透明度</text><text x="420.0" y="398.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >「覆盖」原理一样，只是同样的笔画效果更强、更容易变脏。</text></svg>