<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="自定义画布：颜色配置选 RGB 里的 sRGB" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>自定义画布：颜色配置选 RGB 里的 sRGB</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="800" height="560" fill="#FFFDF5"/><rect x="0" y="0" width="800" height="560" rx="30" fill="#1E293B"/><rect x="14" y="14" width="772" height="532" rx="16" fill="#1F2329"/><text x="40.0" y="52.0" font-size="22" font-weight="800" fill="#E5E7EB" text-anchor="start" >Procreate</text><text x="520.0" y="52.0" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="middle" >选择</text><text x="588.0" y="52.0" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="middle" >导入</text><text x="656.0" y="52.0" font-size="18" font-weight="700" fill="#E5E7EB" text-anchor="middle" >照片</text><text x="730.0" y="52.0" font-size="30" font-weight="700" fill="#E5E7EB" text-anchor="middle" >+</text><circle cx="730" cy="42" r="20" fill="none" stroke="#FBBF24" stroke-width="4.5"/><rect x="14" y="14" width="772" height="532" rx="16" fill="#000" fill-opacity=".45"/><rect x="120" y="74" width="560" height="440" rx="12" fill="#3A3F47" stroke="#111827" stroke-width="1.5"/><text x="400.0" y="106.0" font-size="18" font-weight="800" fill="#E5E7EB" text-anchor="middle" >自定义画布</text><text x="656.0" y="106.0" font-size="16" font-weight="800" fill="#2563EB" text-anchor="end" >创建</text><rect x="132" y="144" width="150" height="36" rx="8" fill="#2B2F36"/><text x="146.0" y="168.0" font-size="15" font-weight="700" fill="#E5E7EB" text-anchor="start" >尺寸</text><rect x="132" y="188" width="150" height="36" rx="8" fill="#2563EB"/><text x="146.0" y="212.0" font-size="15" font-weight="700" fill="#E5E7EB" text-anchor="start" >颜色配置</text><rect x="132" y="232" width="150" height="36" rx="8" fill="#2B2F36"/><text x="146.0" y="256.0" font-size="15" font-weight="700" fill="#E5E7EB" text-anchor="start" >缩时视频设置</text><rect x="132" y="276" width="150" height="36" rx="8" fill="#2B2F36"/><text x="146.0" y="300.0" font-size="15" font-weight="700" fill="#E5E7EB" text-anchor="start" >画布属性</text><rect x="310" y="140" width="200" height="36" rx="10" fill="#2B2F36"/><rect x="314" y="144" width="96" height="28" rx="8" fill="#2563EB"/><text x="362.0" y="164.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle" >RGB</text><text x="460.0" y="164.0" font-size="15" font-weight="800" fill="#E5E7EB" text-anchor="middle" >CMYK</text><text x="316.0" y="214.0" font-size="15" font-weight="600" fill="#E5E7EB" text-anchor="start" >Display P3</text><line x1="312" y1="234.0" x2="648" y2="234.0" stroke="#4B5563" stroke-width="1"/><text x="316.0" y="256.0" font-size="15" font-weight="600" fill="#E5E7EB" text-anchor="start" >sRGB IEC61966-2.1</text><rect x="306" y="237" width="348" height="36" rx="8" fill="none" stroke="#FBBF24" stroke-width="4"/><line x1="312" y1="276.0" x2="648" y2="276.0" stroke="#4B5563" stroke-width="1"/><text x="316.0" y="298.0" font-size="15" font-weight="600" fill="#E5E7EB" text-anchor="start" >其他 RGB 配置……</text><path d="M628 210 l6 6 l10 -12" fill="none" stroke="#2563EB" stroke-width="3"/><text x="626.0" y="214.0" font-size="12" font-weight="700" fill="#9CA3AF" text-anchor="end" >默认</text><circle cx="270" cy="184" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="270.0" y="189.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >1</text><circle cx="522" cy="158" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="522.0" y="163.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >2</text><circle cx="672" cy="255" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="672.0" y="260.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >3</text><rect x="310.0" y="355.0" width="267.2" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="319.0" y="375.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >② 修照片选 RGB（CMYK 是印刷用的）</text><rect x="310.0" y="389.0" width="214.8" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="319.0" y="409.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >③ 发网上的作品选 sRGB 最稳</text><rect x="310.0" y="424.0" width="350.0" height="26" rx="13.0" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="319.0" y="443.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >　 默认的 Display P3 颜色更多，但部分平台显示会偏</text><text x="774.0" y="536.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="end" >示意图：图库「+」→ 带加号的长方形图标 → 颜色配置；列表以实际为准</text></svg>