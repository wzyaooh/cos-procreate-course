<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="低不透明度叠加：25% 叠两笔约 44%，不是 50%" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>低不透明度叠加：25% 叠两笔约 44%，不是 50%</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="320" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="300" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="40.0" y="26.0" width="292.8" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="49.0" y="47.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >同一个颜色、25% 不透明度，抬笔再叠：</text><defs><pattern id="op0" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#FFFFFF"/><rect width="10" height="10" fill="#D1D5DB"/><rect x="10" y="10" width="10" height="10" fill="#D1D5DB"/></pattern></defs><rect x="60" y="80" width="120" height="120" fill="url(#op0)"/><rect x="60" y="80" width="120" height="120" fill="#8B5CF6" fill-opacity="0.250" stroke="#1E293B" stroke-width="2"/><text x="120.0" y="226.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="middle" >叠 1 笔</text><text x="120.0" y="250.0" font-size="18" font-weight="900" fill="#6D28D9" text-anchor="middle" >≈ 25%</text><defs><pattern id="op1" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#FFFFFF"/><rect width="10" height="10" fill="#D1D5DB"/><rect x="10" y="10" width="10" height="10" fill="#D1D5DB"/></pattern></defs><rect x="230" y="80" width="120" height="120" fill="url(#op1)"/><rect x="230" y="80" width="120" height="120" fill="#8B5CF6" fill-opacity="0.438" stroke="#1E293B" stroke-width="2"/><text x="290.0" y="226.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="middle" >叠 2 笔</text><text x="290.0" y="250.0" font-size="18" font-weight="900" fill="#6D28D9" text-anchor="middle" >≈ 44%</text><defs><pattern id="op2" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#FFFFFF"/><rect width="10" height="10" fill="#D1D5DB"/><rect x="10" y="10" width="10" height="10" fill="#D1D5DB"/></pattern></defs><rect x="400" y="80" width="120" height="120" fill="url(#op2)"/><rect x="400" y="80" width="120" height="120" fill="#8B5CF6" fill-opacity="0.578" stroke="#1E293B" stroke-width="2"/><text x="460.0" y="226.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="middle" >叠 3 笔</text><text x="460.0" y="250.0" font-size="18" font-weight="900" fill="#6D28D9" text-anchor="middle" >≈ 58%</text><defs><pattern id="op3" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#FFFFFF"/><rect width="10" height="10" fill="#D1D5DB"/><rect x="10" y="10" width="10" height="10" fill="#D1D5DB"/></pattern></defs><rect x="570" y="80" width="120" height="120" fill="url(#op3)"/><rect x="570" y="80" width="120" height="120" fill="#8B5CF6" fill-opacity="0.684" stroke="#1E293B" stroke-width="2"/><text x="630.0" y="226.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="middle" >叠 4 笔</text><text x="630.0" y="250.0" font-size="18" font-weight="900" fill="#6D28D9" text-anchor="middle" >≈ 68%</text><text x="40.0" y="290.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >不是 25% + 25% = 50%：每一笔只盖住剩下的 25%，越往后加得越少。所以低不透明度多叠几笔，深浅最好控制。</text></svg>