<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="蒙版、剪辑蒙版、阿尔法锁定三者对比" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>蒙版、剪辑蒙版、阿尔法锁定三者对比</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="600" fill="#FFFDF5"/><rect x="10" y="10" width="740" height="580" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="24" y="24" width="230" height="352" rx="12" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="139.0" y="54.0" font-size="18" font-weight="900" fill="#1E293B" text-anchor="middle" >蒙版</text><rect x="266" y="24" width="230" height="352" rx="12" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="381.0" y="54.0" font-size="18" font-weight="900" fill="#1E293B" text-anchor="middle" >剪辑蒙版</text><rect x="508" y="24" width="230" height="352" rx="12" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="623.0" y="54.0" font-size="18" font-weight="900" fill="#1E293B" text-anchor="middle" >阿尔法锁定</text><rect x="44" y="72" width="80" height="60" rx="6" fill="#111" stroke="#1E293B" stroke-width="2"/><path d="M76.5 78 L91.5 78 L95.0 93.0 L109 128 L59 128 L73.0 93.0 Z" fill="#FFF" stroke="#1E293B" stroke-width="1" stroke-linejoin="round"/><text x="134.0" y="98.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >蒙版：黑白灰</text><text x="134.0" y="118.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >黑=藏 白=显</text><path d="M84 132 v14" stroke="#1E293B" stroke-width="3"/><rect x="44" y="146" width="80" height="60" rx="6" fill="#14B8A6" stroke="#1E293B" stroke-width="2"/><text x="134.0" y="172.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >它所属的图层</text><text x="134.0" y="192.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >（整张都换了色）</text><rect x="286" y="72" width="80" height="60" rx="6" fill="#14B8A6" stroke="#1E293B" stroke-width="2"/><path d="M278 84 v30 m-6 -8 l6 9 l6 -9" fill="none" stroke="#1E293B" stroke-width="2.5"/><text x="376.0" y="98.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >上：剪辑层</text><text x="376.0" y="118.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >自己是独立一层</text><defs><pattern id="clp3" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFFFFF"/><rect width="6" height="6" fill="#D1D5DB"/><rect x="6" y="6" width="6" height="6" fill="#D1D5DB"/></pattern></defs><rect x="286" y="146" width="80" height="60" fill="url(#clp3)"/><rect x="286" y="146" width="80" height="60" rx="6" fill="none" stroke="#1E293B" stroke-width="2"/><path d="M318.5 152 L333.5 152 L337.0 167.0 L351 202 L301 202 L315.0 167.0 Z" fill="#8B5CF6" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/><text x="376.0" y="172.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >下：被剪辑的层</text><text x="376.0" y="192.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >它的形状当模子</text><defs><pattern id="alp3" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFFFFF"/><rect width="6" height="6" fill="#D1D5DB"/><rect x="6" y="6" width="6" height="6" fill="#D1D5DB"/></pattern></defs><rect x="528" y="72" width="80" height="134" fill="url(#alp3)"/><rect x="528" y="72" width="80" height="134" rx="6" fill="none" stroke="#1E293B" stroke-width="2"/><path d="M559.0 100 L577.0 100 L581.2 127.0 L598 190 L538 190 L554.8 127.0 Z" fill="#8B5CF6" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/><defs><clipPath id="alpc"><path d="M559.0 100 L577.0 100 L581.2 127.0 L598 190 L538 190 L554.8 127.0 Z" fill="#000" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/></clipPath></defs><path d="M522 164 L614 116" stroke="#14B8A6" stroke-width="10" stroke-opacity=".25"/><path d="M522 164 L614 116" stroke="#14B8A6" stroke-width="10" clip-path="url(#alpc)"/><text x="616.0" y="120.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >只有这一层</text><text x="616.0" y="140.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >透明的地方</text><text x="616.0" y="158.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >画不上去</text><text x="44.0" y="236.0" font-size="13" font-weight="800" fill="#64748B" text-anchor="start" >结果</text><rect x="44" y="244" width="190" height="80" rx="8" fill="#FFF7E6" stroke="#1E293B" stroke-width="1.5"/><path d="M128.5 250 L149.5 250 L154.4 270.4 L174 318 L104 318 L123.6 270.4 Z" fill="#14B8A6" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/><text x="286.0" y="236.0" font-size="13" font-weight="800" fill="#64748B" text-anchor="start" >结果</text><rect x="286" y="244" width="190" height="80" rx="8" fill="#FFF7E6" stroke="#1E293B" stroke-width="1.5"/><path d="M370.5 250 L391.5 250 L396.4 270.4 L416 318 L346 318 L365.6 270.4 Z" fill="#14B8A6" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/><text x="528.0" y="236.0" font-size="13" font-weight="800" fill="#64748B" text-anchor="start" >结果</text><rect x="528" y="244" width="190" height="80" rx="8" fill="#FFF7E6" stroke="#1E293B" stroke-width="1.5"/><path d="M612.5 250 L633.5 250 L638.4 270.4 L658 318 L588 318 L607.6 270.4 Z" fill="#14B8A6" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/><text x="38.0" y="346.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start" >改的是：哪里显示</text><text x="38.0" y="366.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >画黑色藏、白色找回来</text><text x="280.0" y="346.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start" >改的是：上层只在模子里显示</text><text x="280.0" y="366.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >上层随便涂、随便换色</text><text x="522.0" y="346.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="start" >改的是：这一层自己的像素</text><text x="522.0" y="366.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >最快，不多占图层</text><rect x="24" y="396" width="150" height="36" fill="#F1F5F9" stroke="#CBD5E1"/><text x="34.0" y="419.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" ></text><rect x="174" y="396" width="190" height="36" fill="#F1F5F9" stroke="#CBD5E1"/><text x="184.0" y="419.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >蒙版</text><rect x="364" y="396" width="190" height="36" fill="#F1F5F9" stroke="#CBD5E1"/><text x="374.0" y="419.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >剪辑蒙版</text><rect x="554" y="396" width="196" height="36" fill="#F1F5F9" stroke="#CBD5E1"/><text x="564.0" y="419.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >阿尔法锁定</text><rect x="24" y="432" width="150" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="34.0" y="455.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >怎么打开</text><rect x="174" y="432" width="190" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="184.0" y="455.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >图层选项 › 蒙版</text><rect x="364" y="432" width="190" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="374.0" y="455.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >图层选项 › 剪辑蒙版</text><rect x="554" y="432" width="196" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="564.0" y="455.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >图层选项，或两指右滑</text><rect x="24" y="468" width="150" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="34.0" y="491.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >多一个图层吗</text><rect x="174" y="468" width="190" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="184.0" y="491.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >多一个蒙版</text><rect x="364" y="468" width="190" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="374.0" y="491.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >多一个图层</text><rect x="554" y="468" width="196" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="564.0" y="491.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >不多</text><rect x="24" y="504" width="150" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="34.0" y="527.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >改错了能回来吗</text><rect x="174" y="504" width="190" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="184.0" y="527.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >能：涂白就回来</text><rect x="364" y="504" width="190" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="374.0" y="527.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >能：改上层或删掉</text><rect x="554" y="504" width="196" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="564.0" y="527.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >只能撤销</text><rect x="24" y="540" width="150" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="34.0" y="563.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >修图里常用来</text><rect x="174" y="540" width="190" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="184.0" y="563.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >抠图边缘、局部效果</text><rect x="364" y="540" width="190" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="374.0" y="563.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >换色、加阴影高光</text><rect x="554" y="540" width="196" height="36" fill="#FFFFFF" stroke="#CBD5E1"/><text x="564.0" y="563.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >给已抠好的层上色</text></svg>