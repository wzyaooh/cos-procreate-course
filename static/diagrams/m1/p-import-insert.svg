<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="从图库导入会新建同尺寸画布；插入照片会放进当前画布，可能被缩小" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>从图库导入会新建同尺寸画布；插入照片会放进当前画布，可能被缩小</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="360" fill="#FFFDF5"/><rect x="20" y="10" width="360" height="340" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="24.0" width="166.5" height="28" rx="14.0" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >图库 › 照片 / 导入</text><text x="38.0" y="78.0" font-size="14" font-weight="700" fill="#64748B" text-anchor="start" >用照片新建一个画布</text><rect x="400" y="10" width="360" height="340" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="416.0" y="24.0" width="202.8" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="425.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >操作 › 添加 › 插入照片</text><text x="418.0" y="78.0" font-size="14" font-weight="700" fill="#64748B" text-anchor="start" >放进已经打开的画布</text><rect x="50" y="100" width="120" height="160" fill="#FFF7E6" stroke="#1E293B" stroke-width="2.5"/><text x="110.0" y="282.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >照片 3000×4000</text><line x1="178.0" y1="180.0" x2="222.0" y2="180.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><rect x="230" y="100" width="120" height="160" fill="#FFF7E6" stroke="#6D28D9" stroke-width="3.5"/><text x="290.0" y="282.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="middle" >画布 3000×4000</text><text x="40.0" y="318.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >画布和照片一样大，一个像素都不少。</text><text x="40.0" y="340.0" font-size="14" font-weight="800" fill="#047857" text-anchor="start" >修一张照片，用这个。</text><rect x="430" y="100" width="150" height="200" fill="#FFF7E6" stroke="#1E293B" stroke-width="2.5" stroke-dasharray="6 4"/><text x="505.0" y="316.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" >照片 3000×4000</text><line x1="586.0" y1="200.0" x2="622.0" y2="200.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><rect x="630" y="120" width="120" height="160" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3.5"/><rect x="648" y="140" width="84" height="112" fill="#FFF7E6" stroke="#1E293B" stroke-width="2"/><text x="690.0" y="296.0" font-size="12" font-weight="800" fill="#6D28D9" text-anchor="middle" >画布 1500×2000</text><text x="424.0" y="334.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start" >照片比画布大，会被缩到画布里，细节变少。</text></svg>