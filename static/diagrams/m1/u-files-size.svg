eate</text><line x1="40" y1="226" x2="760" y2="226" stroke="#CBD5E1"/><rect x="56" y="182" width="30" height="34" rx="4" fill="#D1FAE5" stroke="#1E293B" stroke-width="1.5"/><text x="100.0" y="205.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >雷电将军_20261021_03.png</text><text x="560.0" y="205.0" font-size="14" font-weight="700" fill="#6D28D9" text-anchor="start" >? MB</text><text x="680.0" y="205.0" font-size="14" font-weight="600" fill="#64748B" text-anchor="start" >PNG</text><line x1="40" y1="282" x2="760" y2="282" stroke="#CBD5E1"/><rect x="56" y="238" width="30" height="34" rx="4" fill="#FEF3C7" stroke="#1E293B" stroke-width="1.5"/><text x="100.0" y="261.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >雷电将军_20261021_03.jpg</text><text x="560.0" y="261.0" font-size="14" font-weight="700" fill="#6D28D9" text-anchor="start" >? MB</text><text x="680.0" y="261.0" font-size="14" font-weight="600" fill="#64748B" text-anchor="start" >JPEG</text><rect x="546" y="120" width="100" height="160" rx="8" fill="none" stroke="#FBBF24" stroke-width="4"/><circle cx="560" cy="300" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="560.0" y="305.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >1</text><rect x="60.0" y="341.0" width="456.5" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="69.0" y="361.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >在「文件」App 右上角切换成「列表」显示，就能看到「大小」这一列</text><rect x="60.0" y="375.0" width="256.0" height="27" rx="13.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="69.0" y="395.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >看不到时，长按文件，选「显示简介」</text><rect x="60.0" y="421.0" width="426.5" height="27" rx="13.5" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="69.0" y="441.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >一般规律：PNG 比 JPEG 大好几倍；.procrea