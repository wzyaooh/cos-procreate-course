<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="羽化：让选区边缘变软" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>羽化：让选区边缘变软</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="330" fill="#FFFDF5"/><defs><radialGradient id="fth"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".6"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity=".45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient></defs><rect x="20" y="10" width="360" height="310" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="24.0" width="194.1" height="28" rx="14.0" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >羽化 0%：选区边缘一刀切</text><rect x="50" y="70" width="300" height="180" fill="#9CA3AF"/><ellipse cx="200" cy="160" rx="70" ry="80" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><circle cx="200" cy="160" r="62" fill="#FFFFFF" fill-opacity=".45"/><text x="50.0" y="276.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >在选区里提亮脸部：</text><text x="50.0" y="298.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start" >一圈明显的亮圆边</text><rect x="400" y="10" width="360" height="310" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="416.0" y="24.0" width="168.0" height="28" rx="14.0" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="425.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >羽化后：边缘慢慢过渡</text><rect x="430" y="70" width="300" height="180" fill="#9CA3AF"/><ellipse cx="580" cy="160" rx="70" ry="80" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><circle cx="580" cy="160" r="100" fill="url(#fth)"/><text x="430.0" y="276.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >在选区里提亮脸部：</text><text x="430.0" y="298.0" font-size="13" font-weight="800" fill="#047857" text-anchor="start" >看不出是从哪里开始提亮的</text></svg>