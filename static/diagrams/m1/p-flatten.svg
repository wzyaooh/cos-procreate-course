<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="导出 PNG、JPEG 会把可见图层压成一张；PNG 保留透明，JPEG 不保留" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>导出 PNG、JPEG 会把可见图层压成一张；PNG 保留透明，JPEG 不保留</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="380" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="360" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="40.0" y="26.0" width="138.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="49.0" y="47.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >导出时发生了什么</text><path d="M60 110 L180 110 L220 80 L100 80 Z" fill="#FBBF24" fill-opacity=".85" stroke="#1E293B" stroke-width="2"/><text x="235.0" y="102.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >光效</text><path d="M74 150 L194 150 L234 120 L114 120 Z" fill="#34D399" fill-opacity=".85" stroke="#1E293B" stroke-width="2"/><text x="249.0" y="142.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >修补</text><path d="M88 190 L208 190 L248 160 L128 160 Z" fill="#C4B5FD" fill-opacity=".85" stroke="#1E293B" stroke-width="2"/><text x="263.0" y="182.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >人物</text><path d="M102 230 L222 230 L262 200 L142 200 Z" fill="#E2E8F0" fill-opacity=".85" stroke="#1E293B" stroke-width="2"/><text x="277.0" y="222.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >背景</text><text x="60.0" y="270.0" font-size="14" font-weight="800" fill="#6D28D9" text-anchor="start" >.procreate / PSD：</text><text x="60.0" y="292.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start" >每一层都留着，能接着改</text><line x1="280.0" y1="160.0" x2="350.0" y2="160.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><text x="315.0" y="146.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle" >压平</text><path d="M370 200 L520 200 L560 150 L410 150 Z" fill="#EDE9FE" stroke="#1E293B" stroke-width="2.5"/><text x="370.0" y="240.0" font-size="14" font-weight="800" fill="#6D28D9" text-anchor="start" >PNG / JPEG / TIFF：</text><text x="370.0" y="262.0" font-size="14" font-weight="600" fill="#1E293B" text-anchor="start" >所有看得见的图层合成一张</text><text x="370.0" y="284.0" font-size="14" font-weight="600" fill="#64748B" text-anchor="start" >隐藏的图层不会导出</text><defs><pattern id="flchk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#FFFFFF"/><rect width="8" height="8" fill="#D1D5DB"/><rect x="8" y="8" width="8" height="8" fill="#D1D5DB"/></pattern></defs><rect x="600" y="70" width="110" height="80" fill="url(#flchk)"/><circle cx="655" cy="110" r="26" fill="#F472B6" stroke="#1E293B" stroke-width="2"/><rect x="600" y="70" width="110" height="80" fill="none" stroke="#1E293B" stroke-width="2"/><text x="655.0" y="168.0" font-size="13" font-weight="800" fill="#047857" text-anchor="middle" >PNG：透明保留</text><rect x="600" y="190" width="110" height="80" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><circle cx="655" cy="230" r="26" fill="#F472B6" stroke="#1E293B" stroke-width="2"/><text x="655.0" y="288.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="middle" >JPEG：透明变成纯色</text><text x="40.0" y="340.0" font-size="14" font-weight="600" fill="#64748B" text-anchor="start" >PNG 无损所以文件大；JPEG 有损压缩所以最小，但每存一次都会再损失一点。</text></svg>