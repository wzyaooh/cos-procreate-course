<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="自动选取的选区阈值" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>自动选取的选区阈值</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="300" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="40.0" y="26.0" width="380.4" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="49.0" y="47.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >自动选取：点一下，把"颜色差不多"的相连区域选进来</text><rect x="40" y="70" width="210" height="160" fill="#D6D3F0" stroke="#1E293B" stroke-width="2"/><path d="M120 90 L170 90 L210 210 L80 210 Z" fill="#8B5CF6" stroke="#1E293B" stroke-width="2"/><path d="M150 90 L170 90 L210 210 L170 210 Z" fill="#6D28D9"/><path d="M120 90 L150 90 L170 210 L80 210 Z" fill="#FBBF24" fill-opacity=".7" stroke="#1E293B" stroke-dasharray="5 4"/><ellipse cx="135" cy="160" rx="7" ry="10" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><text x="145.0" y="258.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="middle" >阈值太低：只选到一小块</text><rect x="276" y="70" width="210" height="160" fill="#D6D3F0" stroke="#1E293B" stroke-width="2"/><path d="M356 90 L406 90 L446 210 L316 210 Z" fill="#8B5CF6" stroke="#1E293B" stroke-width="2"/><path d="M386 90 L406 90 L446 210 L406 210 Z" fill="#6D28D9"/><path d="M356 90 L406 90 L446 210 L316 210 Z" fill="#FBBF24" fill-opacity=".7" stroke="#1E293B" stroke-dasharray="5 4"/><ellipse cx="371" cy="160" rx="7" ry="10" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><text x="381.0" y="258.0" font-size="13" font-weight="800" fill="#047857" text-anchor="middle" >刚好：整条裙子</text><rect x="512" y="70" width="210" height="160" fill="#D6D3F0" stroke="#1E293B" stroke-width="2"/><path d="M592 90 L642 90 L682 210 L552 210 Z" fill="#8B5CF6" stroke="#1E293B" stroke-width="2"/><path d="M622 90 L642 90 L682 210 L642 210 Z" fill="#6D28D9"/><rect x="512" y="70" width="210" height="160" fill="#FBBF24" fill-opacity=".6" stroke="#1E293B" stroke-dasharray="5 4"/><ellipse cx="607" cy="160" rx="7" ry="10" fill="#FDE2CF" stroke="#1E293B" stroke-width="2"/><text x="617.0" y="258.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="middle" >太高：漏到背景里</text><text x="40.0" y="282.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >点住不放、左右拖调阈值；一次选不全，就再点没选到的地方，会加进来。</text></svg>