<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="撤销记录：最多 250 步，回到图库后清空" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>撤销记录：最多 250 步，回到图库后清空</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="300" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="40.0" y="26.0" width="153.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="49.0" y="47.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >撤销记录是怎么存的</text><rect x="34" y="80" width="72" height="44" rx="10" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="70.0" y="108.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >导入</text><rect x="126" y="80" width="72" height="44" rx="10" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="162.0" y="108.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >复制图层</text><line x1="106" y1="102" x2="124" y2="102" stroke="#1E293B" stroke-width="2.5"/><rect x="218" y="80" width="72" height="44" rx="10" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="254.0" y="108.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >画笔</text><line x1="198" y1="102" x2="216" y2="102" stroke="#1E293B" stroke-width="2.5"/><rect x="310" y="80" width="72" height="44" rx="10" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="346.0" y="108.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >画笔</text><line x1="290" y1="102" x2="308" y2="102" stroke="#1E293B" stroke-width="2.5"/><rect x="402" y="80" width="72" height="44" rx="10" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="438.0" y="108.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >变换</text><line x1="382" y1="102" x2="400" y2="102" stroke="#1E293B" stroke-width="2.5"/><rect x="494" y="80" width="72" height="44" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="530.0" y="108.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >画笔</text><line x1="474" y1="102" x2="492" y2="102" stroke="#1E293B" stroke-width="2.5"/><path d="M530 132 q-46 40 -92 0" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arwv)"/><text x="484.0" y="172.0" font-size="13" font-weight="800" fill="#6D28D9" text-anchor="middle" >两指轻点：退一步</text><text x="438.0" y="196.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" >变换里拖了很多下，退出后只算一步</text><rect x="618" y="74" width="104" height="56" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/><text x="670.0" y="98.0" font-size="14" font-weight="800" fill="#B91C1C" text-anchor="middle" >回到图库</text><text x="670.0" y="118.0" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle" >或退出 App</text><line x1="40" y1="230" x2="720" y2="230" stroke="#EF4444" stroke-width="3" stroke-dasharray="8 6"/><text x="40.0" y="258.0" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start" >最多能撤销 250 步。回到图库或退出 Procreate 后，这条记录整条清空，之前的操作再也撤不回来。</text><text x="40.0" y="280.0" font-size="14" font-weight="600" fill="#64748B" text-anchor="start" >所以：重要的一步之前先复制图层；擦掉、合并之前想清楚。</text></svg>