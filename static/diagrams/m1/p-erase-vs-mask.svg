<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="橡皮擦和蒙版的区别：擦掉是删除，蒙版是隐藏" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>橡皮擦和蒙版的区别：擦掉是删除，蒙版是隐藏</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="330" fill="#FFFDF5"/><rect x="20" y="10" width="360" height="310" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="24.0" width="168.0" height="28" rx="14.0" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >橡皮擦：像素真的没了</text><rect x="50" y="70" width="140" height="160" fill="#BAE6FD" stroke="#1E293B" stroke-width="2"/><path d="M120 228 q-46 -60 -26 -120 q26 -40 52 0 q20 60 -26 120 Z" fill="#F472B6" stroke="#1E293B" stroke-width="2"/><circle cx="148" cy="122" r="22" fill="#BAE6FD"/><line x1="200.0" y1="150.0" x2="234.0" y2="150.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><rect x="244" y="70" width="110" height="160" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4"/><text x="252.0" y="110.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start" >想补回来只能撤</text><text x="252.0" y="130.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start" >销。回过图库，</text><text x="252.0" y="150.0" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start" >就再也找不回</text><text x="50.0" y="262.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >红圈处被擦多了一块头发</text><circle cx="148" cy="122" r="26" fill="none" stroke="#EF4444" stroke-width="3"/><text x="50.0" y="290.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >橡皮改的是图层本身</text><rect x="400" y="10" width="360" height="310" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="416.0" y="24.0" width="168.0" height="28" rx="14.0" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="425.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >蒙版涂黑：只是藏起来</text><rect x="430" y="70" width="140" height="160" fill="#BAE6FD" stroke="#1E293B" stroke-width="2"/><path d="M500 228 q-46 -60 -26 -120 q26 -40 52 0 q20 60 -26 120 Z" fill="#F472B6" stroke="#1E293B" stroke-width="2"/><circle cx="528" cy="122" r="22" fill="#BAE6FD"/><line x1="580.0" y1="150.0" x2="614.0" y2="150.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><rect x="624" y="70" width="110" height="160" fill="#D1FAE5" stroke="#047857" stroke-width="2"/><text x="632.0" y="110.0" font-size="13" font-weight="800" fill="#047857" text-anchor="start" >在蒙版上涂白，</text><text x="632.0" y="130.0" font-size="13" font-weight="800" fill="#047857" text-anchor="start" >这块马上回来，</text><text x="632.0" y="150.0" font-size="13" font-weight="800" fill="#047857" text-anchor="start" >随时都行</text><text x="430.0" y="262.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >红圈处被擦多了一块头发</text><circle cx="528" cy="122" r="26" fill="none" stroke="#EF4444" stroke-width="3"/><text x="430.0" y="290.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >蒙版改的是"显示哪里"，原图层没动</text></svg>