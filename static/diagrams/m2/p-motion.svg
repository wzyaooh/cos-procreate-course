<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="动态模糊原理：曝光期间物体移动留下拖影" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>动态模糊原理：曝光期间物体移动留下拖影</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="300" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="34.0" y="24.0" width="303.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="43.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >动态模糊：快门打开的那一瞬间，东西在动</text><circle cx="140" cy="140" r="34" fill="#F472B6" fill-opacity="0.12"/><circle cx="180" cy="140" r="34" fill="#F472B6" fill-opacity="0.18"/><circle cx="220" cy="140" r="34" fill="#F472B6" fill-opacity="0.24"/><circle cx="260" cy="140" r="34" fill="#F472B6" fill-opacity="0.30"/><circle cx="300" cy="140" r="34" fill="#F472B6" fill-opacity="0.36"/><circle cx="340" cy="140" r="34" fill="#F472B6" fill-opacity="0.42"/><circle cx="380" cy="140" r="34" fill="#F472B6" fill-opacity="0.48"/><circle cx="380" cy="140" r="34" fill="#F472B6" stroke="#1E293B" stroke-width="3"/><line x1="130.0" y1="200.0" x2="420.0" y2="200.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><text x="140.0" y="230.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >快门开</text><text x="380.0" y="230.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >快门关</text><text x="470.0" y="110.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >每个位置都留下了一点颜色，</text><text x="470.0" y="136.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >叠起来就是顺着运动方向的拖影。</text><text x="470.0" y="172.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >后期做法：复制一层做动态模糊，</text><text x="470.0" y="196.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >往运动的反方向挪一点放在人物后面，</text><text x="470.0" y="220.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >人物本身保持清楚，读得出是谁。</text></svg>