<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="液化三原则：大笔刷、低压力、少量多次" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>液化三原则：大笔刷、低压力、少量多次</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="300" fill="#FFFDF5"/><rect x="20" y="10" width="360" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="34.0" y="24.0" width="123.0" height="28" rx="14.0" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/><text x="43.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >小笔刷、高压力</text><path d="M50 90 C140 100 260 100 350 90" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4"/><circle cx="125" cy="106" r="12" fill="none" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="170" cy="106" r="12" fill="none" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="215" cy="106" r="12" fill="none" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="260" cy="106" r="12" fill="none" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M50 90 L110 94 Q125 120 140 96 Q160 122 180 96 Q205 126 225 98 Q245 120 265 96 L350 90" fill="none" stroke="#1E293B" stroke-width="3.5"/><path d="M50 90 L110 94 Q125 120 140 96 Q160 122 180 96 Q205 126 225 98 Q245 120 265 96 L350 90 L350 180 L50 180 Z" fill="#FDE2CF" fill-