<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="图层快不够时，按这个顺序合并" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>图层快不够时，按这个顺序合并</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="330" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="310" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="34.0" y="24.0" width="198.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="43.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >图层快不够了：先合并什么</text><rect x="40" y="60" width="216" height="240" rx="12" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="56.0" y="92.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >可以合</text><text x="56.0" y="126.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >· 同一步拆成的好几层（去痘 </text><text x="56.0" y="146.0" font-size="13" font-weight="500" fill="#1E293B" text-anchor="start" >  a、b、c）</text><text x="56.0" y="184.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >· 确定不再改的补画层</text><text x="56.0" y="242.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >· 已经关掉、不打算用的试验层</text><text x="56.0" y="262.0" font-size="13" font-weight="500" fill="#1E293B" text-anchor="start" >   → 直接删</text><rect x="272" y="60" width="216" height="240" rx="12" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="288.0" y="92.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >先存版本再合</text><text x="288.0" y="126.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >· 一整个组都修完了：先在图库</text><text x="288.0" y="146.0" font-size="13" font-weight="500" fill="#1E293B" text-anchor="start" >  复制作品</text><text x="288.0" y="184.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >· 再把这个组合成一层</text><text x="288.0" y="242.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >· 想改时回到旧版本拿</text><rect x="504" y="60" width="216" height="240" rx="12" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/><text x="520.0" y="92.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >不要合</text><text x="520.0" y="126.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >· 原图</text><text x="520.0" y="184.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >· 还要来回调强弱的层（光影、</text><text x="520.0" y="204.0" font-size="13" font-weight="500" fill="#1E293B" text-anchor="start" >  颗粒、调色）</text><text x="520.0" y="242.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >· 带蒙版、还没定稿的人物层</text></svg>