<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="白边原理：边缘像素混进了原背景的颜色" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>白边原理：边缘像素混进了原背景的颜色</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="340" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="34.0" y="24.0" width="363.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="43.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >白边从哪来：边缘的像素是头发和背景混出来的颜色</text><rect x="60" y="70" width="44" height="44" fill="#F472B6" stroke="#1E293B" stroke-width="1.5"/><rect x="104" y="70" width="44" height="44" fill="#F472B6" stroke="#1E293B" stroke-width="1.5"/><rect x="148" y="70" width="44" height="44" fill="#F7A1CF" stroke="#1E293B" stroke-width="1.5"/><rect x="192" y="70" width="44" height="44" fill="#FAD1E7" stroke="#1E293B" stroke-width="1.5"/><rect x="236" y="70" width="44" height="44" fill="#F1F5F9" stroke="#1E293B" stroke-width="1.5"/><rect x="280" y="70" width="44" height="44" fill="#F1F5F9" stroke="#1E293B" stroke-width="1.5"/><text x="60.0" y="136.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >头发</text><text x="148.0" y="136.0" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="start" >边缘：一半头发一半白墙</text><text x="266.0" y="136.0" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" ></text><text x="60.0" y="160.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >抠图时边缘这两格保留了下来（还带着白墙的颜色）</text><text x="60.0" y="200.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >放到深色背景上</text><rect x="60" y="212" width="264" height="44" fill="#1E293B"/><rect x="60" y="212" width="44" height="44" fill="#F472B6" fill-opacity="1" stroke="#1E293B" stroke-width="1.5"/><rect x="104" y="212" width="44" height="44" fill="#F472B6" fill-opacity="1" stroke="#1E293B" stroke-width="1.5"/><rect x="148" y="212" width="44" height="44" fill="#F7A1CF" fill-opacity="0.7" stroke="#1E293B" stroke-width="1.5"/><rect x="192" y="212" width="44" height="44" fill="#FAD1E7" fill-opacity="0.4" stroke="#1E293B" stroke-width="1.5"/><text x="60.0" y="284.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start" >边缘两格偏白，在深色上就是一圈亮边</text><text x="400.0" y="200.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >阿尔法锁定重新上色后</text><rect x="400" y="212" width="264" height="44" fill="#1E293B"/><rect x="400" y="212" width="44" height="44" fill="#F472B6" fill-opacity="1" stroke="#1E293B" stroke-width="1.5"/><rect x="444" y="212" width="44" height="44" fill="#F472B6" fill-opacity="1" stroke="#1E293B" stroke-width="1.5"/><rect x="488" y="212" width="44" height="44" fill="#F472B6" fill-opacity="0.7" stroke="#1E293B" stroke-width="1.5"/><rect x="532" y="212" width="44" height="44" fill="#F472B6" fill-opacity="0.4" stroke="#1E293B" stroke-width="1.5"/><text x="400.0" y="284.0" font-size="13" font-weight="700" fill="#047857" text-anchor="start" >透明度没变，颜色换成了头发色</text><text x="60.0" y="312.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >所以去白边不是把边"擦掉"，而是把边缘的颜色换掉，半透明保留，发丝才不会变硬。</text></svg>