<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="景深原理：离对焦平面越远越模糊" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>景深原理：离对焦平面越远越模糊</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="340" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="34.0" y="24.0" width="243.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="43.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >景深：离对焦的位置越远，越模糊</text><line x1="50" y1="230" x2="720" y2="230" stroke="#1E293B" stroke-width="2.5"/><rect x="56" y="170" width="40" height="28" rx="5" fill="#1E293B"/><circle cx="100" cy="184" r="9" fill="#C4B5FD" stroke="#1E293B" stroke-width="2"/><text x="76.0" y="256.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >相机</text><line x1="380" y1="70" x2="380" y2="230" stroke="#F472B6" stroke-width="2" stroke-dasharray="6 5"/><rect x="388.0" y="69.0" width="66.0" height="25" rx="12.5" fill="#FCE7F3" stroke="#1E293B" stroke-width="2"/><text x="397.0" y="87.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >对焦平面</text><defs><filter id="b113" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.5"/></filter></defs><g filter="url(#b113)"><circle cx="200" cy="190" r="22" fill="#4ADE80" stroke="#1E293B" stroke-width="2.5"/></g><text x="200.0" y="256.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >前景花丛</text><circle cx="200" cy="120" r="12.2" fill="none" stroke="#6D28D9" stroke-width="2"/><circle cx="380" cy="190" r="22" fill="#F472B6" stroke="#1E293B" stroke-width="2.5"/><text x="380.0" y="256.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >人物（对焦）</text><circle cx="380" cy="120" r="4.0" fill="none" stroke="#6D28D9" stroke-width="2"/><defs><filter id="b114" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.5"/></filter></defs><g filter="url(#b114)"><circle cx="560" cy="190" r="22" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/></g><text x="560.0" y="256.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >路灯</text><circle cx="560" cy="120" r="12.2" fill="none" stroke="#6D28D9" stroke-width="2"/><defs><filter id="b115" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter></defs><g filter="url(#b115)"><circle cx="680" cy="190" r="22" fill="#A5B4FC" stroke="#1E293B" stroke-width="2.5"/></g><text x="680.0" y="256.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >远处楼房</text><circle cx="680" cy="120" r="17.6" fill="none" stroke="#6D28D9" stroke-width="2"/><text x="720.0" y="80.0" font-size="12" font-weight="600" fill="#6D28D9" text-anchor="end" >紫圈：一个光点在照片里被摊成多大</text><text x="50.0" y="290.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >眼睛先看清楚、对比强的地方。背景糊掉以后，里面的路人、海报、灯架不再抢眼，人物自然跳出来。</text><text x="50.0" y="314.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >后期模仿时也照这个规律：离人物越远的地方糊得越多，人物脚下的地面和人一样清楚。</text></svg>