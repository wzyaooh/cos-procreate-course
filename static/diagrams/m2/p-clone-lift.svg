<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="锁定与不锁定的区别" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>锁定与不锁定的区别</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="300" fill="#FFFDF5"/><rect x="20" y="10" width="360" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="34.0" y="24.0" width="318.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="43.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >没锁定：抬笔再落笔，圆盘停在上一笔的终点</text><rect x="50" y="60" width="300" height="160" rx="10" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><line x1="50" y1="60" x2="50" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="68" y1="60" x2="68" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="86" y1="60" x2="86" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="104" y1="60" x2="104" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="122" y1="60" x2="122" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="140" y1="60" x2="140" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="158" y1="60" x2="158" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="176" y1="60" x2="176" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="194" y1="60" x2="194" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="212" y1="60" x2="212" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="230" y1="60" x2="230" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="248" y1="60" x2="248" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="266" y1="60" x2="266" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="284" y1="60" x2="284" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="302" y1="60" x2="302" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="320" y1="60" x2="320" y2="220" stroke="#C4B5FD" stroke-width="6"/><line x1="338" y1="60" x2="338" y2="220" stroke="#C4B5FD" stroke-width="6"/><circle cx="110.0" cy="110.0" r="12.0" fill="none" stroke="#FFFFFF" stroke-width="4.5"/><circle cx="110.0" cy="110.0" r="12.0" fill="none" stroke="#1E293B" stroke-width="2"/><line x1="103.0" y1="110.0" x2="117.0" y2="110.0" stroke="#1E293B" stroke-width="2"/><line x1="110.0" y1="103.0" x2="110.0" y2="117.0" stroke="#1E293B" stroke-width="2"/><path d="M200 170 h50" stroke="#F472B6" stroke-width="12" stroke-linecap="round" stroke-opacity=".6"/><circle cx="160.0" cy="110.0" r="12.0" fill="none" stroke="#FFFFFF" stroke-width="4.5"/><circle cx="160.0" cy="110.0" r="12.0" fill="none" stroke="#1E293B" stroke-width="2"/><line x1="153.0" y1="110.0" x2="167.0" y2="110.0" stroke="#1E293B" stroke-width="2"/><line x1="160.0" y1="103.0" x2="160.0" y2="117.0" stroke="#1E293B" stroke-width="2"/><line x1="122.0" y1="110.0" x2="146.0" y2="110.0" stroke="#1E293B" stroke-width="2" marker-end="url(#arw)"/><path d="M264 172 h40" stroke="#EF4444" stroke-width="12" stroke-linecap="round" stroke-opacity=".5"/><text x="50.0" y="246.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >第二笔从别处开始，取样位置跟着变了，</text><text x="50.0" y="268.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >条纹接不上。一段纹理尽量一笔涂完。</text><rect x="400" y="10" width="360" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="414.0" y="24.0" width="228.0" height="28" rx="14.0" fill="#EDE9FE" stroke="#1