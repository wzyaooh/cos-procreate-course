"none" stroke="#6D28D9" stroke-width="2.5"/><circle cx="680" cy="170" r="12" fill="none" stroke="#6D28D9" stroke-width="2.5"/><text x="430.0" y="246.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="start" >适合点修很多个小瑕疵：每次都用同一块干净皮肤。</text><text x="430.0" y="268.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >大面积用锁定会印出一模一样的图案。</text></svg>