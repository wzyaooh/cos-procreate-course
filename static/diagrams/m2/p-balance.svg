<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="颜色平衡的三对互补色和三个明暗范围" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>颜色平衡的三对互补色和三个明暗范围</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="360" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="340" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="34.0" y="24.0" width="333.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="43.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >颜色平衡：三对互补色，往哪头拉就加哪种颜色</text><text x="150.0" y="86.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="end" >青色</text><text x="470.0" y="86.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >红色</text><defs><linearGradient id="g38"><stop offset="0.00" stop-color="#06B6D4"/><stop offset="0.50" stop-color="#E5E7EB"/><stop offset="1.00" stop-color="#EF4444"/></linearGradient></defs><rect x="162" y="70" width="296" height="22" rx="11" fill="url(#g38)" stroke="#1E293B" stroke-width="1.5"/><line x1="310" y1="64" x2="310" y2="98" stroke="#1E293B" stroke-width="2"/><rect x="530.0" y="68.0" width="181.5" height="26" rx="13.0" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/><text x="539.0" y="87.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >偏红（脸太红）→ 往青色拉</text><text x="150.0" y="152.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="end" >紫红色</text><text x="470.0" y="152.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >绿色</text><defs><linearGradient id="g39"><stop offset="0.00" stop-color="#D946EF"/><stop offset="0.50" stop-color="#E5E7EB"/><stop offset="1.00" stop-color="#22C55E"/></linearGradient></defs><rect x="162" y="136" width="296" height="22" rx="11" fill="url(#g39)" stroke="#1E293B" stroke-width="1.5"/><line x1="310" y1="130" x2="310" y2="164" stroke="#1E293B" stroke-width="2"/><rect x="530.0" y="134.0" width="194.5" height="26" rx="13.0" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="539.0" y="153.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >偏绿（日光灯）→ 往紫红色拉</text><text x="150.0" y="218.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="end" >黄色</text><text x="470.0" y="218.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >蓝色</text><defs><linearGradient id="g40"><stop offset="0.00" stop-color="#EAB308"/><stop offset="0.50" stop-color="#E5E7EB"/><stop offset="1.00" stop-color="#3B82F6"/></linearGradient></defs><rect x="162" y="202" width="296" height="22" rx="11" fill="url(#g40)" stroke="#1E293B" stroke-width="1.5"/><line x1="310" y1="196" x2="310" y2="230" stroke="#1E293B" stroke-width="2"/><rect x="530.0" y="200.0" width="194.5" height="26" rx="13.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="539.0" y="219.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >偏黄（室内暖光）→ 往蓝色拉</text><defs><linearGradient id="g41"><stop offset="0.00" stop-color="#111827"/><stop offset="0.50" stop-color="#9CA3AF"/><stop offset="1.00" stop-color="#F9FAFB"/></linearGradient></defs><rect x="60" y="276" width="330" height="26" rx="6" fill="url(#g41)" stroke="#1E293B" stroke-width="1.5"/><rect x="60" y="276" width="110" height="26" fill="none" stroke="#1E293B" stroke-width="2"/><text x="115.0" y="324.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >阴影</text><rect x="170" y="276" width="110" height="26" fill="none" stroke="#1E293B" stroke-width="2"/><text x="225.0" y="324.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >中间调</text><rect x="280" y="276" width="110" height="26" fill="none" stroke="#1E293B" stroke-width="2"/><text x="335.0" y="324.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" >高亮区域</text><text x="420.0" y="294.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >三个按钮决定改哪一段明暗。</text><text x="420.0" y="320.0" font-size="14" font-weight="400" fill="#64748B" text-anchor="start" >偏色多半整张都偏，先改「中间调」。</text></svg>