<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="曲线的三种常见用法" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>曲线的三种常见用法</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="330" fill="#FFFDF5"/><rect x="14" y="10" width="236" height="310" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="28.0" y="24.0" width="93.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="37.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >提亮中间调</text><rect x="42" y="60" width="180" height="160" fill="#1F2329" stroke="#4B5563"/><line x1="87.0" y1="60" x2="87.0" y2="220" stroke="#374151"/><line x1="42" y1="100.0" x2="222" y2="100.0" stroke="#374151"/><line x1="132.0" y1="60" x2="132.0" y2="220" stroke="#374151"/><line x1="42" y1="140.0" x2="222" y2="140.0" stroke="#374151"/><line x1="177.0" y1="60" x2="177.0" y2="220" stroke="#374151"/><line x1="42" y1="180.0" x2="222" y2="180.0" stroke="#374151"/><line x1="42" y1="220" x2="222" y2="60" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M42.0 220.0 C57.0 203.5 102.0 147.5 132.0 120.8 C162.0 94.1 207.0 70.1 222.0 60.0" fill="none" stroke="#FFFFFF" stroke-width="3"/><circle cx="132.0" cy="120.8" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="132.0" y="252.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle" >暗部和亮部两头基本不动，</text><text x="132.0" y="276.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle" >不会把黑色提成灰色</text><rect x="264" y="10" width="236" height="310" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="278.0" y="24.0" width="110.4" height="28" rx="14.0" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="287.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >S 形：加对比</text><rect x="292" y="60" width="180" height="160" fill="#1F2329" stroke="#4B5563"/><line x1="337.0" y1="60" x2="337.0" y2="220" stroke="#374151"/><line x1="292" y1="100.0" x2="472" y2="100.0" stroke="#374151"/><line x1="382.0" y1="60" x2="382.0" y2="220" stroke="#374151"/><line x1="292" y1="140.0" x2="472" y2="140.0" stroke="#374151"/><line x1="427.0" y1="60" x2="427.0" y2="220" stroke="#374151"/><line x1="292" y1="180.0" x2="472" y2="180.0" stroke="#374151"/><line x1="292" y1="220" x2="472" y2="60" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M292.0 220.0 C300.1 214.7 318.7 209.9 340.6 188.0 C362.5 166.1 401.5 110.1 423.4 88.8 C445.3 67.5 463.9 64.8 472.0 60.0" fill="none" stroke="#FFFFFF" stroke-width="3"/><circle cx="340.6" cy="188.0" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><circle cx="423.4" cy="88.8" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="382.0" y="252.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle" >暗的更暗、亮的更亮，</text><text x="382.0" y="276.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle" >中间的坡更陡</text><rect x="514" y="10" width="236" height="310" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="528.0" y="24.0" width="153.0" height="28" rx="14.0" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="537.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >绿色通道往下：去绿</text><rect x="542" y="60" width="180" height="160" fill="#1F2329" stroke="#4B5563"/><line x1="587.0" y1="60" x2="587.0" y2="220" stroke="#374151"/><line x1="542" y1="100.0" x2="722" y2="100.0" stroke="#374151"/><line x1="632.0" y1="60" x2="632.0" y2="220" stroke="#374151"/><line x1="542" y1="140.0" x2="722" y2="140.0" stroke="#374151"/><line x1="677.0" y1="60" x2="677.0" y2="220" stroke="#374151"/><line x1="542" y1="180.0" x2="722" y2="180.0" stroke="#374151"/><line x1="542" y1="220" x2="722" y2="60" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M542.0 220.0 C557.0 208.3 602.0 176.3 632.0 149.6 C662.0 122.9 707.0 74.9 722.0 60.0" fill="none" stroke="#34D399" stroke-width="3"/><circle cx="632.0" cy="149.6" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="632.0" y="252.0" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle" >只减中间调的绿色，</text><text x="632.0" y="276.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle" >画面往紫红色偏一点</text><text x="380.0" y="326.0" font-size="1" font-weight="400" fill="#1E293B" text-anchor="start" ></text></svg>