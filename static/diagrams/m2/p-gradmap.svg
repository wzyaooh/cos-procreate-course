<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="渐变映射把亮度换成渐变上的颜色" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>渐变映射把亮度换成渐变上的颜色</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="300" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="34.0" y="24.0" width="183.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="43.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >渐变映射：按亮度换颜色</text><text x="60.0" y="84.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >照片里每个点的亮度</text><defs><linearGradient id="g42"><stop offset="0.00" stop-color="#000000"/><stop offset="0.50" stop-color="#808080"/><stop offset="1.00" stop-color="#FFFFFF"/></linearGradient></defs><rect x="60" y="96" width="640" height="30" rx="4" fill="url(#g42)" stroke="#1E293B" stroke-width="1.5"/><line x1="124.0" y1="132.0" x2="124.0" y2="168.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><line x1="284.0" y1="132.0" x2="284.0" y2="168.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><line x1="444.0" y1="132.0" x2="444.0" y2="168.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><line x1="636.0" y1="132.0" x2="636.0" y2="168.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><defs><linearGradient id="g43"><stop offset="0.00" stop-color="#3B2416"/><stop offset="0.50" stop-color="#A47551"/><stop offset="1.00" stop-color="#F5E6D3"/></linearGradient></defs><rect x="60" y="176" width="640" height="30" rx="4" fill="url(#g43)" stroke="#1E293B" stroke-width="1.5"/><text x="60.0" y="230.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >换成渐变上同一位置的颜色（这里是一条棕色调的渐变）</text><text x="60.0" y="258.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >左端管最暗的地方，右端管最亮的地方。直接套用会很重，修图里一般把这层的不透明度降到 10%～30%。</text></svg>