<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="蒙版的黑白灰" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>蒙版的黑白灰</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="260" fill="#FFFDF5"/><rect x="20" y="10" width="720" height="240" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="34.0" y="24.0" width="288.0" height="28" rx="14.0" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="43.0" y="45.0" font-size="15" font-weight="700" fill="#1E293B" text-anchor="start" >蒙版：黑色遮住，白色显示，灰色半透明</text><rect x="60" y="64" width="80" height="80" fill="#000000" stroke="#1E293B" stroke-width="2"/><line x1="150.0" y1="104.0" x2="180.0" y2="104.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><defs><pattern id="k166" width="16" height="16" patternUnits="userSpaceOnUse" x="190" y="64"><rect width="16" height="16" fill="#FFFFFF"/><rect width="8" height="8" fill="#D1D5DB"/><rect x="8" y="8" width="8" height="8" fill="#D1D5DB"/></pattern></defs><rect x="190" y="64" width="80" height="80" fill="url(#k166)"/><rect x="190" y="64" width="80" height="80" fill="#F472B6" fill-opacity="0" stroke="#1E293B" stroke-width="2"/><text x="60.0" y="172.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >黑：这里看不见</text><rect x="290" y="64" width="80" height="80" fill="#808080" stroke="#1E293B" stroke-width="2"/><line x1="380.0" y1="104.0" x2="410.0" y2="104.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><defs><pattern id="k167" width="16" height="16" patternUnits="userSpaceOnUse" x="420" y="64"><rect width="16" height="16" fill="#FFFFFF"/><rect width="8" height="8" fill="#D1D5DB"/><rect x="8" y="8" width="8" height="8" fill="#D1D5DB"/></pattern></defs><rect x="420" y="64" width="80" height="80" fill="url(#k167)"/><rect x="420" y="64" width="80" height="80" fill="#F472B6" fill-opacity="0.5" stroke="#1E293B" stroke-width="2"/><text x="290.0" y="172.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >灰：半透明</text><rect x="520" y="64" width="80" height="80" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><line x1="610.0" y1="104.0" x2="640.0" y2="104.0" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arw)"/><defs><pattern id="k168" width="16" height="16" patternUnits="userSpaceOnUse" x="650" y="64"><rect width="16" height="16" fill="#FFFFFF"/><rect width="8" height="8" fill="#D1D5DB"/><rect x="8" y="8" width="8" height="8" fill="#D1D5DB"/></pattern></defs><rect x="650" y="64" width="80" height="80" fill="url(#k168)"/><rect x="650" y="64" width="80" height="80" fill="#F472B6" fill-opacity="1" stroke="#1E293B" stroke-width="2"/><text x="520.0" y="172.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >白：完全显示</text><text x="60.0" y="214.0" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" >蒙版只是"遮"，没有删掉像素：涂错了用白色涂回来就行。这是它比橡皮擦好的地方。</text></svg>