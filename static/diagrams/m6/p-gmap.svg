<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="渐变映射：先看每个像素有多亮，再按亮度从渐变条上取色" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>渐变映射：先看每个像素有多亮，再按亮度从渐变条上取色</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="330" fill="#FFFDF5"/><defs><linearGradient id="gray" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#FFF"/></linearGradient><linearGradient id="gm" x1="0" x2="1"><stop offset="0.00" stop-color="#2A1B4D"/><stop offset="0.33" stop-color="#7C4DAA"/><stop offset="0.67" stop-color="#F2A7C9"/><stop offset="1.00" stop-color="#FFF1F7"/></linearGradient></defs><rect x="20" y="20" width="720" height="290" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="33.0" width="130.0" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="53.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >第一步：只看明暗</text><rect x="60" y="70" width="640" height="40" rx="6" fill="url(#gray)" stroke="#1E293B" stroke-width="2"/><rect x="170.0" y="163.0" width="228.0" height="27" rx="13.5" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="179.0" y="183.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >第二步：按明暗查渐变条上的颜色</text><rect x="60" y="190" width="640" height="40" rx="6" fill="url(#gm)" stroke="#1E293B" stroke-width="2"/><line x1="136.8" y1="114.0" x2="136.8" y2="184.0" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arwv)"/><rect x="144.8" y="125.0" width="66.0" height="25" rx="12.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="153.8" y="143.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >假发暗部</text><line x1="456.8" y1="114.0" x2="456.8" y2="184.0" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arwv)"/><rect x="464.8" y="125.0" width="42.0" height="25" rx="12.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="473.8" y="143.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >皮肤</text><line x1="655.2" y1="114.0" x2="655.2" y2="184.0" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arwv)"/><rect x="663.2" y="125.0" width="42.0" height="25" rx="12.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="672.2" y="143.0" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start" >高光</text><text x="60.0" y="254.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="start" >左端</text><text x="60.0" y="274.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="start" >决定暗部变成什么颜色</text><text x="700.0" y="254.0" font-size="13" font-weight="800" fill="#1E293B" text-anchor="end" >右端</text><text x="700.0" y="274.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="end" >决定亮部变成什么颜色</text><text x="380.0" y="296.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >每个像素都从同一根渐变条上取色，所以整张图的颜色一下子统一了</text></svg>