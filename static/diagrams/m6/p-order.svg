<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" role="img" aria-label="几种滤镜的先后顺序" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>几种滤镜的先后顺序</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="170" fill="#FFFDF5"/><rect x="20" y="30" width="160" height="90" rx="14" fill="#EDE9FE" stroke="#1E293B" stroke-width="2.5"/><text x="100.0" y="68.0" font-size="17" font-weight="800" fill="#1E293B" text-anchor="middle" >渐变映射</text><text x="100.0" y="96.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle" >先定颜色</text><line x1="184.0" y1="75.0" x2="202.0" y2="75.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><rect x="206" y="30" width="160" height="90" rx="14" fill="#FEF3C7" stroke="#1E293B" stroke-width="2.5"/><text x="286.0" y="68.0" font-size="17" font-weight="800" fill="#1E293B" text-anchor="middle" >泛光</text><text x="286.0" y="96.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle" >按新明暗发光</text><line x1="370.0" y1="75.0" x2="388.0" y2="75.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><rect x="392" y="30" width="160" height="90" rx="14" fill="#FCE7F3" stroke="#1E293B" stroke-width="2.5"/><text x="472.0" y="68.0" font-size="17" font-weight="800" fill="#1E293B" text-anchor="middle" >色像差</text><text x="472.0" y="96.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle" >镜头的色边</text><line x1="556.0" y1="75.0" x2="574.0" y2="75.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><rect x="578" y="30" width="160" height="90" rx="14" fill="#D1FAE5" stroke="#1E293B" stroke-width="2.5"/><text x="658.0" y="68.0" font-size="17" font-weight="800" fill="#1E293B" text-anchor="middle" >故障 / 半色调</text><text x="658.0" y="96.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle" >最后一道效果</text><text x="380.0" y="152.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="middle" >后面的效果建立在前面的结果上：泛光看亮度，渐变映射会改亮度；色像差、故障要在发光之后，色边才不会被糊掉</text></svg>