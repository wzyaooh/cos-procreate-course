<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="火焰的形状和颜色" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>火焰的形状和颜色</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="340" fill="#FFFDF5"/><defs><filter id="fl" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="400"><feGaussianBlur stdDeviation="3"/></filter></defs><rect x="20" y="20" width="330" height="300" rx="16" fill="#1B2340" stroke="#1E293B" stroke-width="2.5"/><path d="M95.9 296.0 Q76.2 207.4 130.3 148.4 Q135.2 197.6 154.9 207.4 Q154.9 128.7 179.5 79.5 Q194.3 148.4 184.4 187.8 Q218.9 177.9 214.0 138.6 Q243.5 207.4 204.1 296.0 Z" fill="#DC2626" filter="url(#fl)"/><path d="M104.9 296.0 Q88.5 222.2 133.6 173.0 Q137.7 214.0 154.1 222.2 Q154.1 156.6 174.6 115.6 Q186.9 173.0 178.7 205.8 Q207.4 197.6 203.3 164.8 Q227.9 222.2 195.1 296.0 Z" fill="#F97316" filter="url(#fl)"/><path d="M128.9 296.0 Q119.1 251.7 146.2 222.2 Q148.6 246.8 158.5 251.7 Q158.5 212.4 170.8 187.8 Q178.1 222.2 173.2 241.9 Q190.4 237.0 188.0 217.3 Q202.7 251.7 183.1 296.0 Z" fill="#FACC15" filter="url(#fl)"/><ellipse cx="156" cy="270" rx="26" ry="30" fill="#FFFBEB" filter="url(#fl)"/><path d="M190 71 q6 -8 3 -18 q8 6 5 18 z" fill="#F97316" opacity=".85"/><line x1="180" y1="274" x2="210" y2="274" stroke="#FFFFFF" stroke-width="1.5"/><text x="216.0" y="279.0" font-size="12" font-weight="700" fill="#E5E7EB" text-anchor="start" >底部：白、浅黄</text><line x1="200" y1="196" x2="230" y2="196" stroke="#FFFFFF" stroke-width="1.5"/><text x="236.0" y="201.0" font-size="12" font-weight="700" fill="#E5E7EB" text-anchor="start" >中段：橙</text><line x1="202" y1="106" x2="232" y2="106" stroke="#FFFFFF" stroke-width="1.5"/><text x="238.0" y="111.0" font-size="12" font-weight="700" fill="#E5E7EB" text-anchor="start" >尖端：红，断开</text><rect x="370" y="20" width="370" height="300" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><circle cx="394" cy="56" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="394.0" y="61.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >1</text><text x="416.0" y="61.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >越靠近火源越热、越亮</text><text x="416.0" y="84.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >底部画白和浅黄，越往上越橙、越红</text><circle cx="394" cy="120" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="394.0" y="125.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >2</text><text x="416.0" y="125.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >火是往上飘的气体</text><text x="416.0" y="148.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >每一笔从火源往上画，走 S 形，不要直上直下</text><circle cx="394" cy="184" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="394.0" y="189.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >3</text><text x="416.0" y="189.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >越往上越窄、越淡</text><text x="416.0" y="212.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >尖端收细，有几小片脱离主体飘走</text><circle cx="394" cy="248" r="13" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5"/><text x="394.0" y="253.5" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" >4</text><text x="416.0" y="253.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >火在不停地跳动</text><text x="416.0" y="276.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" >几簇火舌高低不一，不要对称</text></svg>