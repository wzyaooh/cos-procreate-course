<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="色像差：镜头把红蓝光折到不同位置，越往边缘越明显" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>色像差：镜头把红蓝光折到不同位置，越往边缘越明显</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="760" height="360" fill="#FFFDF5"/><rect x="20" y="20" width="340" height="320" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="36.0" y="33.0" width="228.0" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="45.0" y="53.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >镜头把不同颜色的光折到不同位置</text><ellipse cx="140" cy="190" rx="18" ry="80" fill="#EDE9FE" stroke="#1E293B" stroke-width="2.5"/><line x1="40" y1="130" x2="140" y2="130" stroke="#1E293B" stroke-width="3"/><line x1="40" y1="250" x2="140" y2="250" stroke="#1E293B" stroke-width="3"/><text x="40.0" y="120.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >白光</text><line x1="140" y1="130" x2="300" y2="190" stroke="#EF4444" stroke-width="2.5"/><line x1="140" y1="250" x2="300" y2="190" stroke="#EF4444" stroke-width="2.5"/><line x1="140" y1="130" x2="280" y2="190" stroke="#22C55E" stroke-width="2.5"/><line x1="140" y1="250" x2="280" y2="190" stroke="#22C55E" stroke-width="2.5"/><line x1="140" y1="130" x2="260" y2="190" stroke="#2563EB" stroke-width="2.5"/><line x1="140" y1="250" x2="260" y2="190" stroke="#2563EB" stroke-width="2.5"/><line x1="300" y1="100" x2="300" y2="290" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4"/><text x="190.0" y="312.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" >蓝光先聚焦，红光后聚焦</text><text x="190.0" y="332.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" >合不到一个点上，边缘就出现红边、蓝边</text><rect x="380" y="20" width="360" height="320" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="396.0" y="33.0" width="228.0" height="27" rx="13.5" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="405.0" y="53.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >透视模式：离焦点越远，色边越宽</text><rect x="410" y="70" width="300" height="220" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/><circle cx="560.0" cy="180.0" r="48" fill="#D1FAE5" stroke="#047857" stroke-width="2" stroke-dasharray="5 4"/><circle cx="560.0" cy="180.0" r="8" fill="#1E293B"/><circle cx="560.0" cy="180.0" r="3" fill="#FFFFFF"/><text x="560.0" y="246.0" font-size="12" font-weight="700" fill="#047857" text-anchor="middle" >焦点（放在脸上）</text><rect x="436.7" y="98.0" width="30" height="30" fill="#EF4444" opacity=".8"/><rect x="443.3" y="102.0" width="30" height="30" fill="#06B6D4" opacity=".8"/><rect x="440" y="100" width="30" height="30" fill="#1E293B"/><rect x="653.3" y="98.0" width="30" height="30" fill="#EF4444" opacity=".8"/><rect x="646.7" y="102.0" width="30" height="30" fill="#06B6D4" opacity=".8"/><rect x="650" y="100" width="30" height="30" fill="#1E293B"/><rect x="436.7" y="232.0" width="30" height="30" fill="#EF4444" opacity=".8"/><rect x="443.3" y="228.0" width="30" height="30" fill="#06B6D4" opacity=".8"/><rect x="440" y="230" width="30" height="30" fill="#1E293B"/><rect x="653.3" y="232.0" width="30" height="30" fill="#EF4444" opacity=".8"/><rect x="646.7" y="228.0" width="30" height="30" fill="#06B6D4" opacity=".8"/><rect x="650" y="230" width="30" height="30" fill="#1E293B"/><rect x="545.0" y="81.5" width="30" height="30" fill="#EF4444" opacity=".8"/><rect x="545.0" y="86.5" width="30" height="30" fill="#06B6D4" opacity=".8"/><rect x="545.0" y="84" width="30" height="30" fill="#1E293B"/><text x="560.0" y="312.0" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" >绿色虚线圈：「掉落」留出的不受影响范围</text><text x="560.0" y="332.0" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" >边角的方块红蓝错开最多，中间几乎不变</text></svg>