<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-label="报价的组成：基础工时、难度、沟通返修、附加项" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>报价的组成：基础工时、难度、沟通返修、附加项</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="780" height="420" fill="#FFFDF5"/><rect x="10" y="10" width="760" height="400" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><text x="34.0" y="48.0" font-size="17" font-weight="800" fill="#1E293B" text-anchor="start" >一张图的报价，是这几块加起来的</text><rect x="34" y="70" width="260" height="60" fill="#D1FAE5" stroke="#1E293B" stroke-width="2.5"/><text x="44.0" y="106.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >基础</text><rect x="294" y="70" width="150" height="60" fill="#EDE9FE" stroke="#1E293B" stroke-width="2.5"/><text x="304.0" y="106.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >难度</text><rect x="444" y="70" width="110" height="60" fill="#FEF3C7" stroke="#1E293B" stroke-width="2.5"/><text x="454.0" y="106.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >沟通和返修</text><rect x="554" y="70" width="90" height="60" fill="#FCE7F3" stroke="#1E293B" stroke-width="2.5"/><text x="564.0" y="106.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >附加</text><text x="658.0" y="106.0" font-size="16" font-weight="800" fill="#6D28D9" text-anchor="start" >= 单张价</text><rect x="34" y="170" width="22" height="22" rx="4" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="66.0" y="187.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >基础：你修这类图要多少小时 × 你的时薪</text><rect x="34" y="210" width="22" height="22" rx="4" fill="#EDE9FE" stroke="#1E293B" stroke-width="2"/><text x="66.0" y="227.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >难度：合成、手绘特效、复杂比例另算时间</text><rect x="34" y="250" width="22" height="22" rx="4" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="66.0" y="267.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >沟通和返修：来回确认、按约定改的那几次</text><rect x="34" y="290" width="22" height="22" rx="4" fill="#FCE7F3" stroke="#1E293B" stroke-width="2"/><text x="66.0" y="307.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="start" >附加：加急、商用、交分层文件</text><rect x="34" y="338" width="712" height="56" rx="12" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="48.0" y="362.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >时间怎么来：用你自己的作业，在「画布信息 › 统计」里看跟踪时间，按同类型取平均</text><text x="48.0" y="384.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >时薪怎么来：参考你所在城市同类兼职的收入水平，再看同水平后期的公开价目</text></svg>