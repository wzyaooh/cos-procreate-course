<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="交付节点：确认、定金、样片、批量、返修、终稿" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>交付节点：确认、定金、样片、批量、返修、终稿</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="780" height="300" fill="#FFFDF5"/><rect x="10" y="10" width="760" height="280" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><text x="34.0" y="46.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >交付时间要按节点约，不要只说"两周"</text><line x1="92" y1="130" x2="692" y2="130" stroke="#1E293B" stroke-width="4"/><circle cx="92" cy="130" r="16" fill="#D1FAE5" stroke="#1E293B" stroke-width="3"/><text x="92.0" y="136.0" font-size="14" font-weight="900" fill="#1E293B" text-anchor="middle" >1</text><text x="92.0" y="98.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle" >确认约定</text><text x="92.0" y="174.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="middle" >尺度、张数、价格</text><circle cx="212" cy="130" r="16" fill="#D1FAE5" stroke="#1E293B" stroke-width="3"/><text x="212.0" y="136.0" font-size="14" font-weight="900" fill="#1E293B" text-anchor="middle" >2</text><text x="212.0" y="98.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle" >收定金</text><text x="212.0" y="174.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="middle" >按约定比例</text><circle cx="332" cy="130" r="16" fill="#FEF3C7" stroke="#1E293B" stroke-width="3"/><text x="332.0" y="136.0" font-size="14" font-weight="900" fill="#1E293B" text-anchor="middle" >3</text><text x="332.0" y="98.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle" >样片 1 张</text><text x="332.0" y="174.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="middle" >先定方向</text><circle cx="452" cy="130" r="16" fill="#EDE9FE" stroke="#1E293B" stroke-width="3"/><text x="452.0" y="136.0" font-size="14" font-weight="900" fill="#1E293B" text-anchor="middle" >4</text><text x="452.0" y="98.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle" >批量修</text><text x="452.0" y="174.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="middle" >按样片的方向</text><circle cx="572" cy="130" r="16" fill="#FCE7F3" stroke="#1E293B" stroke-width="3"/><text x="572.0" y="136.0" font-size="14" font-weight="900" fill="#1E293B" text-anchor="middle" >5</text><text x="572.0" y="98.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle" >返修</text><text x="572.0" y="174.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="middle" >按约定次数</text><circle cx="692" cy="130" r="16" fill="#D1FAE5" stroke="#1E293B" stroke-width="3"/><text x="692.0" y="136.0" font-size="14" font-weight="900" fill="#1E293B" text-anchor="middle" >6</text><text x="692.0" y="98.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle" >终稿交付</text><text x="692.0" y="174.0" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="middle" >收尾款后</text><rect x="300" y="200" width="300" height="34" rx="10" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/><text x="450.0" y="223.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="middle" >样片确认前不开始批量修</text><text x="34.0" y="268.0" font-size="13.5" font-weight="600" fill="#64748B" text-anchor="start" >每个节点写上日期；对方哪一步晚了，后面的日期一起往后顺延</text></svg>