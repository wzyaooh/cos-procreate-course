<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-label="从取样点的色相、饱和度、亮度读出调色思路" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>从取样点的色相、饱和度、亮度读出调色思路</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="780" height="380" fill="#FFFDF5"/><rect x="10" y="10" width="760" height="360" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><text x="34.0" y="48.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >本来应该是灰色的地方，取出来是什么颜色，就说明后期往那个方向调了</text><rect x="34" y="70" width="226" height="80" rx="10" fill="#1F3340" stroke="#1E293B" stroke-width="2.5"/><rect x="42.0" y="80.0" width="77.5" height="26" rx="13.0" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="51.0" y="99.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >① 最暗处</text><text x="34.0" y="176.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >色相 200° 左右</text><text x="34.0" y="198.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >饱和度 30%+</text><text x="34.0" y="220.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >亮度 12%～20%</text><text x="34.0" y="248.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >暗部被推向青蓝；最黑的地方不是 </text><text x="34.0" y="269.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >0%，说明黑色被提亮了（发灰、胶</text><text x="34.0" y="290.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >片感）</text><rect x="280" y="70" width="226" height="80" rx="10" fill="#7E8F99" stroke="#1E293B" stroke-width="2.5"/><rect x="288.0" y="80.0" width="90.5" height="26" rx="13.0" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="297.0" y="99.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >② 中性的墙</text><text x="280.0" y="176.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >色相 200° 左右</text><text x="280.0" y="198.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >饱和度 10%～15%</text><text x="280.0" y="220.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >亮度 55%</text><text x="280.0" y="248.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >中间调也偏冷，但比暗部淡，说明整</text><text x="280.0" y="269.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >体色温调冷了一点</text><rect x="526" y="70" width="226" height="80" rx="10" fill="#F2E6D6" stroke="#1E293B" stroke-width="2.5"/><rect x="534.0" y="80.0" width="77.5" height="26" rx="13.0" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/><text x="543.0" y="99.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start" >③ 最亮处</text><text x="526.0" y="176.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >色相 30°～40°</text><text x="526.0" y="198.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >饱和度 8%～15%</text><text x="526.0" y="220.0" font-size="14" font-weight="800" fill="#1E293B" text-anchor="start" >亮度 92%～95%</text><text x="526.0" y="248.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >亮部反而偏暖，而且没到 100%</text><text x="526.0" y="269.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >，说明高光被压了一点</text><rect x="34" y="320" width="712" height="34" rx="10" fill="#D1FAE5" stroke="#1E293B" stroke-width="2"/><text x="46.0" y="343.0" font-size="14" font-weight="800" fill="#047857" text-anchor="start" >结论：暗部青、亮部暖、黑色提亮、整体偏冷——这就是常见的"冷色电影感"配方</text></svg>