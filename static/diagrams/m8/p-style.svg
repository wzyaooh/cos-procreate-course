<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-label="风格的三层：每张都一样、每张小调、每张都不同" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>风格的三层：每张都一样、每张小调、每张都不同</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="780" height="400" fill="#FFFDF5"/><rect x="10" y="10" width="760" height="380" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><text x="34.0" y="48.0" font-size="17" font-weight="800" fill="#1E293B" text-anchor="start" >"风格"拆开看，是三层东西</text><rect x="34.0" y="70" width="620" height="92" rx="14" fill="#D1FAE5" stroke="#1E293B" stroke-width="2.5"/><text x="52.0" y="100.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >每张都一样</text><text x="52.0" y="124.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >存成预设、模板、笔刷组，一键套用</text><text x="638.0" y="96.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="end" >Lightroom 预设：颜色分级、混合、颗粒</text><text x="638.0" y="118.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="end" >Procreate 渐变映射、调色板</text><text x="638.0" y="140.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="end" >模板里的图层组和混合模式</text><rect x="84.0" y="172" width="520" height="92" rx="14" fill="#FEF3C7" stroke="#1E293B" stroke-width="2.5"/><text x="102.0" y="202.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >每张小调</text><text x="102.0" y="226.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >固定范围，按照片微调</text><text x="588.0" y="198.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="end" >曝光度、白平衡（每张光线不同）</text><text x="588.0" y="220.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="end" >边缘光、光斑的强弱</text><text x="588.0" y="242.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="end" >暗角大小</text><rect x="134.0" y="274" width="420" height="92" rx="14" fill="#FCE7F3" stroke="#1E293B" stroke-width="2.5"/><text x="152.0" y="304.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >每张都不同</text><text x="152.0" y="328.0" font-size="13" font-weight="600" fill="#64748B" text-anchor="start" >靠诊断和手艺，不能预设</text><text x="538.0" y="300.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="end" >修瑕、比例、液化</text><text x="538.0" y="322.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="end" >去路人、补背景</text><line x1="690.0" y1="90.0" x2="690.0" y2="340.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><text x="706.0" y="200.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >越往下</text><text x="706.0" y="220.0" font-size="13" font-weight="700" fill="#64748B" text-anchor="start" >越靠手艺</text></svg>