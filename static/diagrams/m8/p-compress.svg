<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-label="平台会缩图再压缩一次，细节最先丢" font-family="system-ui,-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif"><title>平台会缩图再压缩一次，细节最先丢</title><defs><marker id="arw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E293B"/></marker><marker id="arwr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="arwv" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker></defs><rect width="780" height="360" fill="#FFFDF5"/><rect x="10" y="10" width="760" height="340" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/><rect x="38" y="44" width="200" height="96" rx="14" fill="#1E293B"/><rect x="34" y="40" width="200" height="96" rx="14" fill="#D1FAE5" stroke="#1E293B" stroke-width="2.5"/><text x="50.0" y="72.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >你上传的图</text><text x="50.0" y="98.0" font-size="13.5" font-weight="600" fill="#64748B" text-anchor="start" >长边很大、质量拉满</text><line x1="242.0" y1="88.0" x2="278.0" y2="88.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><rect x="288" y="44" width="200" height="96" rx="14" fill="#1E293B"/><rect x="284" y="40" width="200" height="96" rx="14" fill="#FEF3C7" stroke="#1E293B" stroke-width="2.5"/><text x="300.0" y="72.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >平台处理</text><text x="300.0" y="98.0" font-size="13.5" font-weight="600" fill="#64748B" text-anchor="start" >①缩到它要的尺寸</text><text x="300.0" y="120.0" font-size="13.5" font-weight="600" fill="#64748B" text-anchor="start" >②再压缩一次</text><line x1="492.0" y1="88.0" x2="528.0" y2="88.0" stroke="#1E293B" stroke-width="3" marker-end="url(#arw)"/><rect x="538" y="44" width="200" height="96" rx="14" fill="#1E293B"/><rect x="534" y="40" width="200" height="96" rx="14" fill="#FCE7F3" stroke="#1E293B" stroke-width="2.5"/><text x="550.0" y="72.0" font-size="16" font-weight="800" fill="#1E293B" text-anchor="start" >别人看到的图</text><text x="550.0" y="98.0" font-size="13.5" font-weight="600" fill="#64748B" text-anchor="start" >已经被处理过两次</text><text x="34.0" y="176.0" font-size="15" font-weight="800" fill="#1E293B" text-anchor="start" >压缩时最先被吃掉的东西</text><rect x="34" y="196" width="350" height="42" rx="10" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/><text x="48.0" y="223.0" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start" >细颗粒、噪点 → 变成一片糊</text><rect x="404" y="196" width="350" height="42" rx="10" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/><text x="418.0" y="223.0" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start" >大面积渐变（天空、背景光） → 出现一圈圈色带</text><rect x="34" y="248" width="350" height="42" rx="10" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/><text x="48.0" y="275.0" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start" >细发丝、细文字水印 → 边上发脏</text><rect x="404" y="248" width="350" height="42" rx="10" fill="#FEE2E2" stroke="#1E293B" stroke-width="2"/><text x="418.0" y="275.0" font-size="13.5" font-weight="700" fill="#1E293B" text-anchor="start" >很饱和的红、紫 → 溢色、变脏</text><text x="34.0" y="320.0" font-size="14" font-weight="800" fill="#6D28D9" text-anchor="start" >所以：自己先缩到合适尺寸、用 sRGB、少用细颗粒，发之前用"仅自己可见"测一次</text></svg>